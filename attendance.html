  h+='<div class="kp"><div>عدد الردود<b>'+R.n+'</b></div>'+(idx?'<div>مؤشر الرضا العام<b>'+pctTxt(R.overall)+'</b>'+(rt?rt.i+' '+rt.t:'')+'</div>':'')+
    '<div>فترة الردود<b style="font-size:13px">'+(Object.keys(R.days).sort()[0]||'—')+' — '+(R.last?dateKey(new Date(R.last)):'—')+'</b></div></div>';
  var bk=Object.keys(R.blocks);
  if(idx&&bk.length>1) h+='<h3>مؤشر الرضا حسب المجال</h3><table><thead><tr><th>المجال</th><th style="width:45%"></th><th style="width:70px">النسبة</th><th style="width:80px">التقدير</th></tr></thead><tbody>'+
    bk.map(function(b){var B=R.blocks[b],r=rateOf(B.mean);return '<tr><td class="l">'+esc(B.title)+'</td><td><div class="bar" style="width:'+B.mean+'%"></div></td><td>'+pctTxt(B.mean)+'</td><td>'+(r?r.t:'')+'</td></tr>';}).join('')+'</tbody></table>';
  var lastB=-1,tbl='';
  R.qs.forEach(function(o,i){
    var q=o.q;
    if(q.type==='likert'){
      var opts=SURVEY_SCALES[q.scale].opts,cols=LK_COLORS[opts.length];
      if(q.block!==lastB){
        if(lastB!==-1) tbl+='</tbody></table>';lastB=q.block;
        tbl+='<h3>'+esc(q.blockTitle||'توزيع الإجابات')+'</h3><div class="lg">'+opts.map(function(x,j){return '<span><i style="background:'+cols[j]+'"></i>'+esc(x)+'</span>';}).join('')+'</div>'+
          '<table><thead><tr><th style="width:28px">م</th><th>العبارة</th>'+opts.map(function(x){return '<th style="width:52px">'+esc(x)+'</th>';}).join('')+'<th style="width:60px">'+(idx?'الرضا':'نسبة «'+esc(opts[0])+'»')+'</th></tr></thead><tbody>';
      }
      tbl+='<tr><td>'+(i+1)+'</td><td class="l">'+esc(q.t)+(q.rev?' <span class="mut">(سلبية)</span>':'')+'</td>'+o.counts.map(function(c){return '<td>'+(o.answered?Math.round(c*100/o.answered)+'%':'—')+'</td>';}).join('')+'<td><b>'+pctTxt(idx?o.mean:o.agree)+'</b></td></tr>';
      return;

    if(q.type==='single'||q.type==='multi'){

        return '<tr><td class="l" style="width:40%">'+esc(x)+'</td><td><div class="bar" style="width:'+p+'%"></div></td><td style="width:90px">'+c+' ('+Math.round(p)+'%)</td></tr>';}).join('')+'</tbody></table>';

  printDoc('نتائج استبانة - '+f.title,'<section class="page">'+h+'</section>',css);
}
function exportFormCsv(fid){
  var f=Object.assign({id:fid},A.forms[fid]),t=tplById(f.tpl),qs=tplQuestions(t),rs=formResps(fid);
  var cell=function(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  var head=['التاريخ','الوقت'].concat(t.fields.map(function(x){return x.label;}),qs.map(function(q,i){return (i+1)+'. '+q.t;}));
  var lines=[head.map(cell).join(',')];
  rs.sort(function(a,b){return a.at-b.at;}).forEach(function(r){
    var row=[dateKey(new Date(r.at)),hm(r.at)].concat(t.fields.map(function(x){return r.f&&r.f[x.id]||'';}),qs.map(function(q){
      var v=r.a&&r.a[q.id];if(v==null||v==='')return '';
      if(q.type==='likert') return SURVEY_SCALES[q.scale].opts[+v];
      if(q.type==='single') return q.opts[+v];
      if(q.type==='multi') return toArr(v).map(function(i){return q.opts[i];}).concat(r.a[q.id+'_o']?[r.a[q.id+'_o']]:[]).join('؛ ');
      return v;
    }));
    lines.push(row.map(cell).join(','));
  });
  var blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  var u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='ردود - '+f.title+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},5000);
}

// =====================================================================
//  نموذج الاستبانة العام (يفتحه الطالب أو ولي الأمر أو المعلم)
// =====================================================================
var FM={school:null,fid:null,f:null,t:null,qs:[],a:{},fields:{}};
function openPublicForm(school,fid){
  show('scrBoot');
  rd('att_forms/'+school+'/'+fid).then(function(f){
    if(!f||!tplById(f.tpl)) return blocked('الاستبانة غير موجودة','ربما حُذفت. تواصل مع إدارة المدرسة.');
    FM={school:school,fid:fid,f:f,t:tplById(f.tpl),qs:tplQuestions(tplById(f.tpl)),a:{},fields:{}};
    $('fmSchool').textContent=f.schoolName||'';
    show('scrForm');
    if(f.open===false) return fmMessage('⏸','انتهى استقبال الردود','توقفت هذه الاستبانة عن استقبال الردود. شكراً لاهتمامك.');
    if(LS.get('att_fm_done_'+fid)) return fmMessage('✅','سبق أن أرسلت إجابتك','شكراً لك، وصلت إجابتك على هذه الاستبانة.','<button class="btn btn-o" style="margin-top:14px" onclick="LS.del(\'att_fm_done_'+fid+'\');renderPublicForm()">إرسال إجابة أخرى من هذا الجهاز</button>');
    renderPublicForm();
  }).catch(netErr);
}
function fmMessage(icon,title,sub,extra){
  $('fmProg').classList.add('hidden');
  $('fmBody').innerHTML='<div class="card" style="text-align:center;padding:34px 18px;margin-top:10px"><div style="font-size:54px">'+icon+'</div>'+
    '<h2 style="color:var(--gd);font-size:20px;margin-top:6px">'+title+'</h2><p class="muted" style="font-size:14px;margin-top:6px;line-height:1.9">'+sub+'</p>'+(extra||'')+'</div>';
}
function renderPublicForm(){
  var t=FM.t,f=FM.f,lastB=-1,num=0;
  var h='<div class="fm-head"><div style="font-size:12px;opacity:.85">'+t.icon+' استبانة موجهة إلى: '+esc(t.aud)+'</div><h2>'+esc(f.title)+'</h2><p>'+esc(t.intro)+'</p></div>';
  if(t.fields.length){
    h+='<div class="fm-card" id="fmFields">'+t.fields.map(function(x){
      var inp=x.type==='select'?'<select data-f="'+x.id+'" onchange="fmField(this)"><option value="">اختر</option>'+x.opts.map(function(o){return '<option>'+esc(o)+'</option>';}).join('')+'</select>':
        '<input type="'+(x.type==='tel'?'tel':'text')+'" data-f="'+x.id+'" oninput="fmField(this)"'+(x.type==='tel'?' dir="ltr" placeholder="05xxxxxxxx"':'')+'>';
      return '<div class="fld" id="fmF_'+x.id+'"><label class="f">'+esc(x.label)+(x.req?' *':'')+'</label>'+inp+'</div>';
    }).join('')+'</div>';
  }
  FM.qs.forEach(function(q){
    if(q.type==='likert'&&q.block!==lastB&&q.blockTitle) h+='<div class="fm-sec">'+esc(q.blockTitle)+'</div>';
    lastB=q.block;num++;
    var opts=q.type==='likert'?SURVEY_SCALES[q.scale].opts:q.opts,body;
    if(q.type==='text') body='<textarea data-q="'+q.id+'" oninput="fmText(this)" placeholder="اكتب إجابتك هنا"></textarea>';
    else body='<div class="fm-opts">'+opts.map(function(o,i){return '<button type="button" class="opt" data-q="'+q.id+'" data-i="'+i+'" onclick="fmPick(this)">'+esc(o)+'</button>';}).join('')+'</div>'+
      (q.other?'<input type="text" style="margin-top:8px" data-q="'+q.id+'_o" oninput="fmText(this)" placeholder="'+esc(q.other)+'">':'');
    h+='<div class="fm-card" id="fmQ_'+q.id+'"><div class="fm-q"><span class="n">'+num+'.</span> '+esc(q.t)+(fmRequired(q)?' <span style="color:var(--abs)">*</span>':'')+'</div>'+body+'</div>';
  });
  h+='<div class="err" id="fmErr" style="text-align:center"></div><div class="stick"><button class="btn btn-g btn-lg btn-w" id="fmSend" onclick="fmSubmit()">✅ إرسال الإجابات</button></div>';
  $('fmBody').innerHTML=h;
  $('fmProg').classList.remove('hidden');fmProgress();
}
// عبارات المقياس والاختيار الواحد إلزامية كما في النماذج الأصلية، والأسئلة المكتوبة اختيارية
function fmRequired(q){return q.type==='likert'||q.type==='single'||!!q.req;}
function fmPick(el){
  var id=el.dataset.q,i=+el.dataset.i,q=FM.qs.find(function(x){return x.id===id;});
  if(q.type==='multi'){
    var arr=toArr(FM.a[id]),k=arr.indexOf(i);
    if(k>=0)arr.splice(k,1);else arr.push(i);
    FM.a[id]=arr;el.classList.toggle('on',k<0);
  } else {
    FM.a[id]=i;
    el.parentNode.querySelectorAll('.opt').forEach(function(b){b.classList.toggle('on',b===el);});
  }
  $('fmQ_'+id).classList.remove('miss');fmProgress();
}
function fmText(el){FM.a[el.dataset.q]=el.value;var c=$('fmQ_'+el.dataset.q);if(c)c.classList.remove('miss');fmProgress();}
function fmField(el){FM.fields[el.dataset.f]=el.value;}
function fmAnswered(q){var v=FM.a[q.id];return q.type==='multi'?toArr(v).length>0:(v!=null&&String(v).trim()!=='');}
function fmProgress(){
  var req=FM.qs.filter(fmRequired),done=req.filter(fmAnswered).length;
  $('fmProgBar').style.width=(req.length?done*100/req.length:100)+'%';
}
function fmSubmit(){
  var miss=FM.qs.filter(function(q){return fmRequired(q)&&!fmAnswered(q);});
  var fmiss=FM.t.fields.filter(function(x){return x.req&&!String(FM.fields[x.id]||'').trim();});
  document.querySelectorAll('#fmBody .miss').forEach(function(e){e.classList.remove('miss');});
  if(miss.length||fmiss.length){
    miss.forEach(function(q){$('fmQ_'+q.id).classList.add('miss');});
    if(fmiss.length) $('fmFields').classList.add('miss');
    $('fmErr').textContent='يرجى الإجابة عن جميع الأسئلة المطلوبة ('+(miss.length+fmiss.length)+' متبقية)';
    var first=fmiss.length?$('fmFields'):$('fmQ_'+miss[0].id);
    first.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  var a={};Object.keys(FM.a).forEach(function(k){var v=FM.a[k];if(v!=null&&!(typeof v==='string'&&!v.trim())&&!(Array.isArray(v)&&!v.length))a[k]=v;});
  var fields={};Object.keys(FM.fields).forEach(function(k){if(String(FM.fields[k]).trim())fields[k]=String(FM.fields[k]).trim();});
  var btn=$('fmSend');btn.disabled=true;btn.textContent='جاري الإرسال...';
  DB.ref('att_resp/'+FM.school+'/'+FM.fid).push({at:Date.now(),f:fields,a:a}).then(function(){
    LS.set('att_fm_done_'+FM.fid,1);window.scrollTo(0,0);
    fmMessage('✅','شكراً لك','تم إرسال إجابتك بنجاح. نقدّر وقتك ومشاركتك في تطوير المدرسة.',
      '<button class="btn btn-lg btn-w" style="margin-top:20px" onclick="closeApp()">إغلاق</button><div id="tClosedNote" class="muted hidden" style="margin-top:12px">يمكنك الآن إغلاق هذه الصفحة.</div>');
  }).catch(function(){btn.disabled=false;btn.textContent='✅ إرسال الإجابات';toast('تعذّر الإرسال، تحقق من الاتصال وحاول مجدداً',true);});
}

// =====================================================================
//  TEACHER (المعلم)
// =====================================================================
var T={school:null,tid:null,key:null,teacher:null,S:null,sched:{},schoolName:'',cls:null,cid:null,p:null,d:null,existing:null,timer:null,editing:false,view:''};

function startTeacher(school,tid,key){
  show('scrBoot');
  rd('att_tkeys/'+school+'/'+tid).then(function(k){
    if(!k||k.key!==key) return blocked('الرابط لم يعد صالحاً','اطلب من إدارة المدرسة إرسال رابط جديد لك.');
    T.school=school;T.tid=String(tid);T.key=key;T.schoolName=k.schoolName||'';
    return Promise.all([rd('pt_'+school+'/teachers'),rd('att_settings/'+school),rd('att_schedule/'+school+'/'+tid)]).then(function(r){
      T.teacher=toArr(r[0]).find(function(t){return String(t.id)===String(tid);});
      if(!T.teacher) return blocked('لم يُعثر على بياناتك','ربما حُذف اسمك من سجل المعلمين. تواصل مع إدارة المدرسة.');
      T.S=normSettings(r[1]);T.sched=r[2]||{};
      $('tSchool').textContent=T.schoolName||'—';$('tName').textContent='أ. '+T.teacher.name;
      renderInstall();show('scrTeacher');
      teacherRefresh();
      clearInterval(T.timer);
      // يتحقق كل 30 ثانية ويفتح التحضير تلقائياً عند بداية الحصة
      T.timer=setInterval(function(){if(T.view==='idle')teacherRefresh(true);},30000);
    });
  }).catch(netErr);
}
function tSlot(d,p){return (T.sched['d'+d]&&T.sched['d'+d]['p'+p])||'';}
function teacherRefresh(silent){
  if(!T.teacher) return;
  var reload=silent?Promise.resolve():Promise.all([rd('att_settings/'+T.school),rd('att_schedule/'+T.school+'/'+T.tid)]).then(function(r){T.S=normSettings(r[0]);T.sched=r[1]||{};});
  reload.then(function(){
    var d=schoolDay(),p=d<0?null:curAttPeriod(T.S);
    if(p&&tSlot(d,p)) return openAttendance(d,p,tSlot(d,p));
    T.editing=false;renderTeacherIdle(d,p);
  }).catch(function(){if(!silent)toast('تعذّر الاتصال',true);});
}
function renderTeacherIdle(d,p){
  var now=new Date();
  var head='<div class="t-head"><div class="meta">'+fmtDay(now)+' • '+fmtHijri(now)+'</div><div class="cls">'+
    (d<0?'اليوم إجازة 🌙':p?'ليس لديك حصة الآن':'لا يوجد تحضير مطلوب الآن')+'</div></div>';
  var list='';
  if(d>=0){
    list='<div class="card">'+T.S.att.map(function(pp){
      var P=T.S.periods[pp-1]||{},cid=tSlot(d,pp);
      return '<div class="row"><div class="main"><div class="nm">'+pLabel(pp)+'</div><div class="sub">'+(P.s||'')+' – '+(P.e||'')+'</div></div>'+
        '<span class="badge'+(cid?'':' no')+'" id="tcls'+pp+'">'+(cid?'…':'لا توجد حصة')+'</span></div>';
    }).join('')+'</div>'+
    '<p class="muted" style="text-align:center;margin-top:12px">يُفتح التحضير تلقائياً عند بداية حصة التحضير. اترك التطبيق مفتوحاً أو افتحه وقت الحصة.</p>';
  }
  var sub=p?'<button class="btn btn-o btn-w" style="margin-top:14px" onclick="pickOtherClass()">📋 تحضير فصل آخر (حصة انتظار)</button>':'';
  T.view='idle';
  $('tBody').innerHTML=head+list+sub;
  // أسماء الفصول لحصص اليوم
  if(d>=0) T.S.att.forEach(function(pp){
    var cid=tSlot(d,pp);if(!cid)return;
    rd('att_classes/'+T.school+'/'+cid).then(function(c){var el=$('tcls'+pp);if(el)el.textContent=clsName(c);});
  });
}
function pickOtherClass(){
  rd('att_classes/'+T.school).then(function(all){
    var opts=sortedClasses(all||{}).filter(function(c){return c.section;}).map(function(c){return '<option value="'+c.id+'">'+esc(clsName(c))+'</option>';}).join('');
    openModal('تحضير فصل آخر','<p class="muted" style="margin-bottom:10px">استخدم هذا عند دخولك حصة انتظار في فصل غير مسجّل في جدولك.</p><div class="fld"><label class="f">الفصل</label><select id="fOC">'+opts+'</select></div>',
      '<button class="btn" onclick="var c=$(\'fOC\').value;closeModal();openAttendance(schoolDay(),curAttPeriod(T.S),c)">متابعة</button><button class="btn btn-o" onclick="closeModal()">إلغاء</button>');
  }).catch(function(){toast('تعذّر الاتصال',true);});
}
function openAttendance(d,p,cid){
  if(!p){toast('انتهى وقت حصة التحضير',true);return;}
  if(T.editing&&T.cid===cid&&T.p===p) return;
  $('tBody').innerHTML='<div class="empty"><div class="spin"></div></div>';
  Promise.all([rd('att_classes/'+T.school+'/'+cid),rd('att_records/'+T.school+'/'+dateKey()+'/p'+p+'/'+cid)]).then(function(r){
    T.cls=r[0];T.cid=cid;T.p=p;T.d=d;T.existing=r[1];
    if(!T.cls){$('tBody').innerHTML='<div class="card empty"><span class="e">⚠️</span>الفصل المسجّل في جدولك غير موجود. تواصل مع إدارة المدرسة.</div>';return;}
    if(T.existing&&String(T.existing.tid)===T.tid) renderSubmitted();
    else renderAttendanceForm();
  }).catch(function(){toast('تعذّر الاتصال',true);});
}
function renderAttendanceForm(){
  T.editing=true;T.view='form';
  var prev=rowsMap(T.existing),st=toArr(T.cls.students),P=T.S.periods[T.p-1]||{};
  var html='<div class="t-head"><div class="meta">'+pLabel(T.p)+' • '+(P.s||'')+'–'+(P.e||'')+' • '+fmtDay(new Date())+'</div><div class="cls">'+esc(clsName(T.cls))+'</div><div class="meta">'+st.length+' طالباً</div></div>';
  if(T.existing&&String(T.existing.tid)!==T.tid) html+='<div class="note warn" style="margin-bottom:10px">سبق تحضير هذا الفصل بواسطة أ. '+esc(T.existing.teacher)+' الساعة '+hm(T.existing.at)+'. إرسالك سيحدّث التحضير.</div>';
  html+='<div class="chips" id="tChips"></div><div class="card">'+st.map(function(s,i){
    var v=(prev[s.id]&&prev[s.id].s)||'p';
    return '<div class="srow st-'+v+'" id="sr_'+s.id+'"><span class="i">'+(i+1)+'</span><span class="n">'+esc(s.name)+'</span>'+
      '<select data-id="'+s.id+'" onchange="setSt(this)"><option value="p"'+(v==='p'?' selected':'')+'>حاضر</option><option value="l"'+(v==='l'?' selected':'')+'>متأخر</option><option value="a"'+(v==='a'?' selected':'')+'>غائب</option></select></div>';
  }).join('')+'</div>'+
  '<div class="stick"><button class="btn btn-g btn-lg btn-w" id="tSubmit" onclick="submitAttendance()">✅ إرسال التحضير</button></div>';
  $('tBody').innerHTML=html;updateChips();
}
function setSt(sel){$('sr_'+sel.dataset.id).className='srow st-'+sel.value;updateChips();}
function updateChips(){
  var c={p:0,l:0,a:0};document.querySelectorAll('#tBody select[data-id]').forEach(function(s){c[s.value]++;});
  $('tChips').innerHTML='<span class="chip c-p">حاضر '+c.p+'</span><span class="chip c-l">متأخر '+c.l+'</span><span class="chip c-a">غائب '+c.a+'</span>';
}
function submitAttendance(){
  var names={};toArr(T.cls.students).forEach(function(s){names[s.id]=s.name;});
  var rows=[];document.querySelectorAll('#tBody select[data-id]').forEach(function(s){rows.push({id:s.dataset.id,n:names[s.dataset.id],s:s.value});});
  var btn=$('tSubmit');btn.disabled=true;btn.textContent='جاري الإرسال...';
  var rec={tid:T.tid,teacher:T.teacher.name,at:Date.now(),rows:rows};
  wr('att_records/'+T.school+'/'+dateKey()+'/p'+T.p+'/'+T.cid,rec).then(function(){
    T.existing=rec;renderSubmitted();
  }).catch(function(){btn.disabled=false;btn.textContent='✅ إرسال التحضير';toast('تعذّر الإرسال، تحقق من الاتصال وحاول مجدداً',true);});
}
function renderSubmitted(){
  T.editing=false;T.view='done';
  $('tBody').innerHTML='<div class="card" style="text-align:center;padding:34px 18px;margin-top:10px">'+
    '<div style="font-size:54px">✅</div>'+
    '<h2 style="color:var(--ok);font-size:21px;margin-top:6px">شكراً لك أ. '+esc(T.teacher.name)+'</h2>'+
    '<p style="font-size:14px;color:var(--tm);margin-top:6px">تم إرسال تحضير '+esc(clsName(T.cls))+' — '+pLabel(T.p)+' بنجاح.</p>'+
    '<button class="btn btn-lg btn-w" style="margin-top:22px" onclick="closeApp()">إغلاق</button>'+
    '<div id="tClosedNote" class="muted hidden" style="margin-top:12px">يمكنك الآن إغلاق هذه الصفحة والعودة إلى الواتساب.</div>'+
    '<a href="#" onclick="renderAttendanceForm();return false" class="muted" style="display:inline-block;margin-top:14px;text-decoration:underline">تعديل التحضير</a></div>';
}
// بعض المتصفحات تمنع الصفحة من إغلاق نفسها، فنعرض عندها تنبيهاً بالإغلاق يدوياً
function closeApp(){
  try{window.close();}catch(e){}
  setTimeout(function(){var n=$('tClosedNote');if(n)n.classList.remove('hidden');},400);
}

// ====== MODAL ======
function openModal(title,body,foot){
  $('mTitle').textContent=title;$('mBody').innerHTML=body;$('mFoot').innerHTML=foot||'';
  $('modal').classList.remove('hidden');
}
function closeModal(){$('modal').classList.add('hidden');SEND.open=false;}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});

if('serviceWorker' in navigator){navigator.serviceWorker.register('att-sw.js',{scope:'./attendance.html'}).catch(function(e){console.warn('SW',e);});}
window.addEventListener('hashchange',boot);
boot();
