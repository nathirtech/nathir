<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>سجل الغياب والتأخر</title>
<meta name="description" content="تحضير غياب وتأخر الطلاب — منصة رابط للإدارة المدرسية">
<meta name="theme-color" content="#1a3a6b">
<link rel="manifest" href="att-manifest.json">
<link rel="icon" type="image/png" href="att-icon-192.png">
<link rel="apple-touch-icon" href="att-icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سجل الغياب">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="att-surveys.js"></script>
<style>
:root{--gd:#1a3a6b;--gm:#1e5fa8;--gl:#0099b8;--gp:#e8f0f8;--tm:#3a4a6b;--tl:#7a8aab;--bd:#d0d8e8;--bg:#f5f4f0;
  --ok:#1a7a4a;--okb:#e3f5ea;--late:#8a5a00;--lateb:#fff4d6;--abs:#b42318;--absb:#fde8e6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Cairo',Tahoma,sans-serif;background:var(--bg);color:var(--tm);direction:rtl}
body{min-height:100vh;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
button,input,select{font-family:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--gd);background:var(--gd);color:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn-o{background:#fff;color:var(--gd)}
.btn-l{background:var(--gp);color:var(--gd);border-color:var(--gp)}
.btn-r{background:#fff;color:var(--abs);border-color:#f1b8b2}
.btn-g{background:#1f8f55;border-color:#1f8f55}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn-lg{padding:12px 20px;font-size:15px;border-radius:12px}
.btn-w{width:100%}
.ib{border:1px solid var(--bd);background:#fff;border-radius:7px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;flex-shrink:0}
.ib:hover{background:var(--gp)}
.ib.del:hover{background:var(--absb);border-color:#f1b8b2}
.card{background:#fff;border:1.5px solid var(--bd);border-radius:14px}
input[type=text],input[type=tel],input[type=time],input[type=date],input[type=number],select{width:100%;padding:9px 12px;border:1.5px solid var(--bd);border-radius:9px;font-size:14px;background:#fff;color:var(--tm);outline:none}
input:focus,select:focus{border-color:var(--gl)}
label.f{display:block;font-size:12px;font-weight:700;color:var(--tm);margin-bottom:5px}
.fld{margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--abs);font-size:12px;font-weight:700;margin-top:8px;min-height:18px}
.muted{color:var(--tl);font-size:12px}
.note{background:#f7f9fc;border:1px solid #e6eaf2;border-radius:10px;padding:10px 12px;font-size:12px;color:var(--tm);line-height:1.9}
.note.warn{background:var(--lateb);border-color:#f3d990;color:var(--late)}
.empty{text-align:center;padding:32px 16px;color:var(--tl);font-size:13px;line-height:1.9}
.empty .e{font-size:36px;display:block;margin-bottom:4px}

/* ===== header ===== */
.hdr{background:linear-gradient(90deg,#ddd9d0 0%,#f5f4f0 30%,#f5f4f0 70%,#ddd9d0 100%);border-bottom:3px solid var(--gd);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.hdr-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:50px;width:auto}
.brand .sep{width:1px;height:34px;background:var(--bd)}
.brand h1{font-size:17px;font-weight:800;color:var(--gd);line-height:1.35}
.brand p{font-size:11px;color:var(--tl)}
.hdr-actions{display:flex;gap:6px;flex-wrap:wrap}

/* ===== home ===== */
.today{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tcard{padding:12px 14px;cursor:pointer}
.tcard .t{font-size:12px;color:var(--tl);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:6px}
.tcard .n{font-size:22px;font-weight:800;color:var(--gd);margin:2px 0 6px}
.tcard .n small{font-size:12px;color:var(--tl);font-weight:600}
.bar{height:7px;border-radius:5px;background:var(--gp);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:5px;transition:width .3s}
.live{font-size:10px;background:var(--okb);color:var(--ok);padding:1px 8px;border-radius:10px;font-weight:800;white-space:nowrap}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.mtabs{display:flex;gap:6px;flex-wrap:wrap}
.mtab{border:1.5px solid var(--bd);background:#fff;color:var(--tm);padding:8px 14px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap}
.mtab.on{background:var(--gd);color:#fff;border-color:var(--gd)}
.daybar{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.sv-card{padding:14px 16px;margin-bottom:10px}
.sv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sv-head .nm{font-weight:800;color:var(--gd);font-size:15px}
.chk{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid #f1f3f8;font-size:13px;cursor:pointer}
.chk input{width:17px;height:17px}
.svf{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 2px 14px}
.svf-o{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:var(--tm);cursor:pointer;padding:4px 0}
.svf-o input{width:17px;height:17px;accent-color:var(--gd);margin:0}
.svf-o.on{color:var(--gd)}
/* ===== survey form (public) ===== */
.fm-prog{position:sticky;top:0;z-index:5;height:5px;background:var(--gp)}
.fm-prog i{display:block;height:100%;background:#1f8f55;transition:width .25s}
.fm-head{background:linear-gradient(135deg,var(--gd),var(--gl));color:#fff;border-radius:16px;padding:18px;margin-bottom:12px}
.fm-head h2{font-size:19px;font-weight:800;line-height:1.5}
.fm-head p{font-size:13px;opacity:.92;line-height:1.9;margin-top:6px}
.fm-card{background:#fff;border:1.5px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.fm-card.miss{border-color:var(--abs);box-shadow:0 0 0 3px var(--absb)}
.fm-sec{font-size:14px;font-weight:800;color:var(--gd);margin:16px 2px 8px}
.fm-q{font-size:14px;font-weight:700;color:var(--tm);line-height:1.8;margin-bottom:10px}
.fm-q .n{display:inline-block;min-width:24px;color:var(--tl);font-weight:800}
.fm-opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1.5px solid var(--bd);background:#fff;color:var(--tm);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;line-height:1.4}
.opt.on{background:var(--gd);border-color:var(--gd);color:#fff}
.fm-card textarea{width:100%;min-height:84px;padding:9px 12px;border:1.5px solid var(--bd);border-radius:9px;font-family:inherit;font-size:14px;resize:vertical;outline:none}
.fm-card textarea:focus{border-color:var(--gl)}
/* ===== survey library & dashboard ===== */
.aud{font-size:11px;font-weight:800;padding:2px 9px;border-radius:10px;background:var(--gp);color:var(--gd)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;color:var(--tl);font-weight:700}
.kpi .v{font-size:28px;font-weight:800;color:#0b0b0b;line-height:1.3}
.kpi .v small{font-size:14px;color:var(--tl)}
.rate{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:#0b0b0b}
.rate i{width:10px;height:10px;border-radius:50%;display:inline-block}
.dsec{padding:16px;margin-bottom:12px}
.dsec h3{font-size:15px;font-weight:800;color:var(--gd);margin-bottom:4px}
.dsec .sub{font-size:12px;color:var(--tl);margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px;font-size:12px;color:#52514e}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.lk-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 54px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #f1f3f8}
.lk-row .t{font-size:13px;color:var(--tm);line-height:1.7}
.lk-row .m{font-size:13px;font-weight:800;color:#0b0b0b;text-align:left}
.stack{display:flex;gap:2px;height:22px}
.stack span{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;min-width:0;overflow:hidden}
.stack span:first-child{border-radius:0 4px 4px 0}.stack span:last-child{border-radius:4px 0 0 4px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 70px;gap:10px;align-items:center;padding:6px 0}
.hb .t{font-size:13px;color:var(--tm);line-height:1.6}
.hb .track{height:16px;background:#f3f2ee;border-radius:0 4px 4px 0}
.hb .track i{display:block;height:100%;background:#2a78d6;border-radius:0 4px 4px 0;min-width:2px}
.hb .v{font-size:12px;font-weight:800;color:#0b0b0b;text-align:left;white-space:nowrap}
.cols{display:flex;align-items:flex-end;gap:4px;height:110px;border-bottom:1px solid #c3c2b7;padding-top:6px}
.cols span{flex:1;background:#2a78d6;border-radius:4px 4px 0 0;min-height:2px;max-width:34px}
.cols-x{display:flex;gap:4px;font-size:10px;color:#898781;margin-top:4px}
.cols-x span{flex:1;text-align:center;max-width:34px}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sw .it{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.7;padding:6px 0;border-top:1px solid #f1f3f8}
.sw .it b{white-space:nowrap;color:#0b0b0b}
.quote{background:#f7f9fc;border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.8;margin-bottom:6px;color:var(--tm)}
.quote small{display:block;color:var(--tl);font-size:11px}
#vizTip{position:fixed;z-index:120;pointer-events:none;background:#0b0b0b;color:#fff;font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;max-width:260px;line-height:1.6;display:none}
@media(max-width:640px){.lk-row{grid-template-columns:1fr 46px}.lk-row .stack{grid-column:1/3;grid-row:2}.hb{grid-template-columns:1fr 64px}.hb .track{grid-column:1/3;grid-row:2}.sw{grid-template-columns:1fr}}
@media(max-width:560px){.mtabs{width:100%;flex-wrap:nowrap}.mtab{flex:1;padding:8px 4px;font-size:12px;white-space:normal;line-height:1.35}}
.daybar select{width:auto;padding:7px 10px;font-size:13px;font-weight:700;color:var(--gd)}
.daybar .past{font-size:11px;font-weight:800;color:var(--late);background:var(--lateb);padding:3px 10px;border-radius:10px}
.tabs{display:flex;gap:4px;background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:14px;overflow-x:auto}
.tab{flex:1;border:none;background:none;padding:9px 10px;border-radius:9px;font-size:13px;font-weight:700;color:var(--tl);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--gd);color:#fff}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .grow{flex:1;min-width:170px;width:auto}
.toolbar select{width:auto;min-width:150px}

/* ===== lists ===== */
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #eef1f6}
.row:last-child{border-bottom:none}
.row .main{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:14px;color:var(--gd)}
.row .sub{font-size:11px;color:var(--tl)}
.ops{display:flex;gap:5px;flex-wrap:wrap}
.av{width:36px;height:36px;border-radius:50%;background:var(--gp);color:var(--gd);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;background:var(--gp);color:var(--gd);white-space:nowrap}
.badge.ok{background:var(--okb);color:var(--ok)}
.badge.warn{background:var(--lateb);color:var(--late)}
.badge.no{background:#f1f3f8;color:var(--tl)}

/* ===== classes accordion ===== */
details.grade{background:#fff;border:1.5px solid var(--bd);border-radius:14px;margin-bottom:10px;overflow:hidden}
details.grade>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:10px;font-weight:800;color:var(--gd);font-size:15px}
details summary::-webkit-details-marker{display:none}
details>summary .chev{color:var(--tl);transition:transform .2s;font-size:12px}
details[open]>summary>.chev{transform:rotate(-90deg)}
details>summary .grow{flex:1}
details.sec{border-top:1px solid #eef1f6}
details.sec>summary{list-style:none;cursor:pointer;padding:10px 16px;display:flex;align-items:center;gap:8px;background:#fafbfd}
details.sec>summary .nm{flex:1;font-weight:700;color:var(--tm);font-size:14px}
.stu{display:flex;align-items:center;gap:8px;padding:6px 16px;border-top:1px solid #f1f3f8;font-size:13px}
.stu .i{width:24px;color:var(--tl);font-size:11px;text-align:center}
.stu .n{flex:1}
.stu .ib{width:28px;height:28px;font-size:12px}
.addrow{display:flex;gap:6px;padding:10px 16px;border-top:1px solid #eef1f6;background:#fafbfd}

/* ===== schedule ===== */
.seg{display:inline-flex;background:var(--gp);border-radius:9px;padding:3px;flex-shrink:0}
.seg button{border:none;background:none;padding:6px 12px;border-radius:7px;font-size:12px;font-weight:700;color:var(--tl);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--gd);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tblwrap{overflow-x:auto;background:#fff;border:1.5px solid var(--bd);border-radius:14px}
table.grid{border-collapse:collapse;width:100%;min-width:600px;font-size:12px}
table.grid th{background:var(--gd);color:#fff;padding:7px 6px;font-weight:700;line-height:1.4}
table.grid th small{display:block;font-weight:400;font-size:10px;opacity:.8}
table.grid th.att{background:#1f8f55}
table.grid td{border:1px solid #e6eaf2;padding:0;text-align:center;height:44px}
table.grid td.hd{background:#f7f9fc;font-weight:700;color:var(--gd);padding:6px 10px;white-space:nowrap;text-align:right}
table.grid td.attc{background:#f3fbf6}
.cell{width:100%;height:100%;min-height:44px;border:none;background:none;cursor:pointer;font-size:12px;font-weight:700;color:var(--gd);padding:4px}
.cell:hover{background:rgba(0,153,184,.1)}
.cell.nil{color:#c3cbd9;font-weight:400}
.cell.conflict{background:var(--absb);color:var(--abs)}

/* ===== modal ===== */
.mbg{position:fixed;inset:0;background:rgba(15,30,60,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:640px){.mbg{align-items:center;padding:16px}.modal{border-radius:18px}}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid #eef1f6}
.mh h3{font-size:16px;font-weight:800;color:var(--gd)}
.mx{border:none;background:var(--gp);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;color:var(--gd);flex-shrink:0}
.mb{padding:16px 18px;overflow-y:auto}
.mf{padding:12px 18px;border-top:1px solid #eef1f6;display:flex;gap:8px;flex-wrap:wrap}
.linkbox{direction:ltr;text-align:left;font-size:12px;background:#f7f9fc;border:1px dashed var(--bd);border-radius:9px;padding:9px 10px;word-break:break-all;margin:10px 0;color:var(--gm)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--gd);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.toast.bad{background:var(--abs)}

/* ===== welcome / activation ===== */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wcard{background:#fff;border:1.5px solid var(--bd);border-radius:20px;max-width:440px;width:100%;padding:26px 22px;text-align:center;box-shadow:0 10px 30px rgba(26,58,107,.08)}
.wcard img.logo{height:96px;margin-bottom:6px}
.wcard h2{font-size:20px;font-weight:800;color:var(--gd);margin-bottom:4px}
.wcard p{font-size:13px;color:var(--tl);line-height:1.9}
.codebox{font-size:28px;letter-spacing:8px;font-weight:800;color:var(--gd);background:var(--gp);border-radius:12px;padding:8px;margin:6px 0 4px;direction:ltr}
.steps{text-align:right;background:#f7f9fc;border-radius:12px;padding:12px 16px;margin:12px 0;font-size:13px;line-height:2.1;color:var(--tm)}
.steps b{color:var(--gd)}
.code-in{font-size:26px!important;text-align:center;letter-spacing:10px;direction:ltr;font-weight:800;margin:12px 0 4px}
.spin{width:34px;height:34px;border:4px solid var(--gp);border-top-color:var(--gd);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== teacher ===== */
.t-head{background:linear-gradient(135deg,var(--gd),var(--gl));color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:12px}
.t-head .cls{font-size:22px;font-weight:800;line-height:1.4}
.t-head .meta{font-size:12px;opacity:.92}
.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:800;padding:5px 12px;border-radius:20px}
.c-p{background:var(--okb);color:var(--ok)}.c-l{background:var(--lateb);color:var(--late)}.c-a{background:var(--absb);color:var(--abs)}
.srow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #eef1f6;transition:background .15s}
.srow:last-child{border-bottom:none}
.srow .i{width:24px;text-align:center;color:var(--tl);font-size:12px}
.srow .n{flex:1;font-size:14px;font-weight:600;line-height:1.5}
.srow select{width:auto;min-width:98px;padding:6px 8px;font-size:13px;font-weight:700}
.srow.st-l{background:var(--lateb)}.srow.st-a{background:var(--absb)}
.srow.st-l select{color:var(--late);border-color:#f0c96b}.srow.st-a select{color:var(--abs);border-color:#f1b8b2}
.stick{position:sticky;bottom:0;padding:12px 0 max(12px,env(safe-area-inset-bottom));background:linear-gradient(rgba(245,244,240,0),var(--bg) 35%)}
.plist .row .nm{font-size:13px}

@media(max-width:560px){
  .brand img{height:40px}.brand h1{font-size:15px}
  .fgrid{grid-template-columns:1fr}
  .hdr-actions .btn span{display:none}
}
</style>
</head>
<body>

<!-- ============ LOADING ============ -->
<div id="scrBoot" class="center"><div style="text-align:center"><div class="spin"></div><div class="muted">جاري التحميل...</div></div></div>

<!-- ============ ACTIVATION (no session) ============ -->
<div id="scrActivate" class="center hidden">
  <div class="wcard">
    <img class="logo" src="logo.png" alt="رابط">
    <h2>سجل الغياب والتأخر</h2>
    <p><b>المعلم:</b> افتح رابط التحضير من رسالة الواتساب مباشرة، ولا تحتاج أي رمز.</p>

function defPeriods(){
  return [{s:'07:00',e:'07:45'},{s:'07:45',e:'08:30'},{s:'08:30',e:'09:15'},{s:'09:35',e:'10:20'},

function normSettings(s){
  s=s||{};

  var att=toArr(s.att).map(Number).filter(function(n){return n>0;});
  return {periods:periods.length?periods:defPeriods(),att:(att.length?att:[1,4]).sort(function(a,b){return a-b;}),saved:!!s.periods};
}
// التحضير متاح من 5 دقائق قبل بداية الحصة حتى 10 دقائق بعد نهايتها
function curAttPeriod(S){
  var m=nowMin();
  for(var i=0;i<S.att.length;i++){var p=S.att[i],P=S.periods[p-1];if(P&&m>=toMin(P.s)-5&&m<=toMin(P.e)+10)return p;}
  return null;
}
function targetAttPeriod(S){
  var m=nowMin();
  for(var i=0;i<S.att.length;i++){var p=S.att[i],P=S.periods[p-1];if(P&&m<=toMin(P.e)+10)return p;}
  return S.att[S.att.length-1];
}

var STAGE=['الابتدائي','المتوسط','الثانوي'];
var STAGE_S=['ب','م','ث'];
function gradeRank(g){
  g=String(g||'');
  var s=STAGE.findIndex(function(x){return g.indexOf(x)>=0;});
  var o=ORD.findIndex(function(x){return g.indexOf(x)===0;});
  return (s<0?9:s)*10+(o<0?9:o);
}
function secRank(s){return !s?9999:(isNaN(+s)?500:+s);}
function sortedClasses(obj){
  return Object.keys(obj||{}).map(function(id){return Object.assign({id:id},obj[id]);}).sort(function(a,b){
    return gradeRank(a.grade)-gradeRank(b.grade)||String(a.grade).localeCompare(String(b.grade),'ar')||
           secRank(a.section)-secRank(b.section)||String(a.section||'').localeCompare(String(b.section||''),'ar');
  });
}
function clsName(c){if(!c)return 'فصل محذوف';return c.grade+(c.section?' / '+c.section:' — بدون فصل');}
function clsShort(c){
  if(!c) return '؟';
  var g=String(c.grade);
  var s=STAGE.findIndex(function(x){return g.indexOf(x)>=0;});
  var o=ORD.findIndex(function(x){return g.indexOf(x)===0;});
  var base=(o>=0&&s>=0)?ORD_S[o]+' '+STAGE_S[s]:g;
  return base+(c.section?'/'+c.section:'');
}

function boot(){
  // الروابط الجديدة تستخدم ?t= لأنها تصمد أكثر عند فتحها من الواتساب، والقديمة #t= ما زالت تعمل
  var h=location.hash,q=new URLSearchParams(location.search);
  var inv=q.get('i')||(h.indexOf('#i=')===0?decodeURIComponent(h.slice(3)):'');
  var tl=q.get('t')||(h.indexOf('#t=')===0?h.slice(3):'');
  // رابط استبانة عام: يُفتح لأي شخص دون تسجيل دخول ودون المساس بجلسة الجهاز
  var sv=q.get('s');
  if(sv){var sp=sv.split('.');return openPublicForm(sp[0],sp[1]);}
  if(inv) return openInviteLink(inv);
  if(tl){
    var p=tl.split('.').map(decodeURIComponent);
    return openTeacherLink(p[0],p[1],p[2]);
  }
  var s=LS.get('att_session');
  if(s&&s.kind==='admin') return startAdmin(s.token);
  if(s&&s.kind==='teacher') return startTeacher(s.school,s.tid,s.key);
  show('scrActivate');
}

function openInviteLink(token){
  show('scrBoot');

    clearHash();

function openTeacherLink(school,tid,key){
  show('scrBoot');
  var cur=LS.get('att_session');
  if(cur&&cur.kind==='admin'){
    if(!confirm('هذا الجهاز مسجّل حالياً كحساب إدارة.\nهل تريد فتح رابط المعلم والتبديل إلى وضع المعلم؟')){clearHash();return startAdmin(cur.token);}
  }
  rd('att_tkeys/'+school+'/'+tid).then(function(k){

  }).catch(netErr);

function activate(){
  var c=$('actCode').value.replace(/\D/g,'');
  var err=$('actErr');err.textContent='';
  if(c.length!==6){err.textContent='الرمز يتكوّن من 6 أرقام';return;}
  $('actBtn').disabled=true;
  rd('att_codes/'+c).then(function(v){
    $('actBtn').disabled=false;
    if(!v){err.textContent='رمز التفعيل غير صحيح';return;}
    if(v.kind==='admin'){LS.set('att_session',{kind:'admin',token:v.token});startAdmin(v.token);}
    else{LS.set('att_session',{kind:'teacher',school:v.school,tid:String(v.tid),key:v.key});startTeacher(v.school,String(v.tid),v.key);}
  }).catch(function(){$('actBtn').disabled=false;err.textContent='تعذّر الاتصال، حاول مرة أخرى';});
}

    ?'<button class="btn btn-g btn-lg btn-w" style="margin-top:14px" onclick="doInstall()">📲 تثبيت التطبيق على جهازي</button>'

function weekDates(i){
  var s=parseKey(WEEKS[i][1]);
  return [0,1,2,3,4].map(function(k){return new Date(s.getFullYear(),s.getMonth(),s.getDate()+k);});
}
function weekOf(dk){
  for(var i=0;i<WEEKS.length;i++){if(weekDates(i).some(function(d){return dateKey(d)===dk;}))return i;}
  return -1;
}
// اليوم إن كان يوم دراسة، وإلا آخر يوم دراسي مضى
function defaultDay(){
  var today=parseKey(dateKey()),best=null;
  WEEKS.forEach(function(w,i){weekDates(i).forEach(function(d){if(d<=today)best=d;});});
  return dateKey(best||parseKey(WEEKS[0][1]));
}
function isToday(){return A.day===dateKey();}
function selDow(){return schoolDay(parseKey(A.day));}
function renderDayBar(){
  var wi=weekOf(A.day),today=parseKey(dateKey()),def=defaultDay();
  var wopts=WEEKS.map(function(w,i){
    return '<option value="'+i+'"'+(i===wi?' selected':'')+(parseKey(w[1])>today?' disabled':'')+'>'+w[0]+'</option>';
  }).join('');
  var dopts=wi<0?'':weekDates(wi).map(function(d){
    var k=dateKey(d);
    return '<option value="'+k+'"'+(k===A.day?' selected':'')+(d>today?' disabled':'')+'>'+DAYS[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)+'</option>';
  }).join('');
  // الاستبانات لا ترتبط بيوم، والخطة الأسبوعية تحتاج الأسبوع فقط
  if(A.sec==='surv'){$('aDayBar').innerHTML='';return;}
  var plan=A.sec==='plan',back=plan?weekOf(A.day)!==weekOf(def):A.day!==def;
  $('aDayBar').innerHTML=(back?'<span class="past">'+(plan?'عرض أسبوع سابق':'عرض يوم سابق')+'</span><button class="btn btn-l btn-sm" onclick="setDay(defaultDay())">↩ '+(plan?'هذا الأسبوع':def===dateKey()?'اليوم':'آخر يوم دراسي')+'</button>':'')+
    '<select onchange="pickWeek(+this.value)">'+wopts+'</select>'+(plan?'':'<select onchange="setDay(this.value)">'+dopts+'</select>');
}
function pickWeek(i){setDay(weekOf(defaultDay())===i?defaultDay():dateKey(weekDates(i)[0]));}

// استيراد كشف الطلاب (Excel من نظام نور أو جدول بسيط يحتوي عمود «اسم الطالب»)
var _import=null;
function importExcel(inp){
  var file=inp.files[0];inp.value='';if(!file)return;
  openModal('استيراد كشف الطلاب','<div class="empty"><div class="spin"></div>جاري قراءة الملف...</div>');
  var ready=window.XLSX?Promise.resolve():loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
  ready.then(function(){return file.arrayBuffer();}).then(function(buf){
    _import=parseWorkbook(XLSX.read(buf,{type:'array'}));
    renderImportPreview();
  }).catch(function(e){console.warn(e);$('mBody').innerHTML='<div class="empty"><span class="e">⚠️</span>تعذّر قراءة الملف. تأكد أنه ملف Excel صحيح.</div>';});
}
function parseWorkbook(wb){
  var groups={},order=[];
  wb.SheetNames.forEach(function(sn){
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:false}).map(function(r){
      return r.map(function(v){return String(v==null?'':v).replace(/\s+/g,' ').trim();});
    });
    var h=rows.findIndex(function(r){return r.indexOf('اسم الطالب')>=0;});
    if(h<0) return;
    var H=rows[h],ni=H.indexOf('اسم الطالب'),ci=H.indexOf('الفصل'),gi=H.indexOf('الصف');
    // في كشف نور: «الصف» و«الفصل» خانات عنوان فوق الجدول وقيمتها في نفس السطر
    function label(name){
      for(var i=0;i<h;i++){
        var r=rows[i];if(r.indexOf(name)<0)continue;
        for(var j=0;j<r.length;j++){if(r[j]&&r[j]!==name&&r[j]!==':')return r[j];}
        return '';
      }
      return '';
    }
    var sg=label('الصف'),ss=label('الفصل');
    for(var k=h+1;k<rows.length;k++){
      var r=rows[k],n=r[ni];
      if(!n||n==='اسم الطالب') continue;
      var g=(gi>=0&&r[gi])||sg||'غير محدد',s=(ci>=0&&r[ci])||ss||'';
      var key=g+'|'+s;
      if(!groups[key]){groups[key]={grade:g,section:s,names:[]};order.push(key);}
      if(groups[key].names.indexOf(n)<0) groups[key].names.push(n);
    }
  });
  var list=order.map(function(k){return groups[k];});
  return {groups:list,total:list.reduce(function(a,g){return a+g.names.length;},0)};
}
function renderImportPreview(){
  var r=_import;
  if(!r.total){$('mBody').innerHTML='<div class="empty"><span class="e">⚠️</span>لم أجد عمود «اسم الطالب» في الملف.<br>استخدم «كشف الطلاب» المُصدَّر من نظام نور.</div>';return;}
  var byG={};r.groups.forEach(function(g){(byG[g.grade]=byG[g.grade]||[]).push(g);});
  var noSec=r.groups.filter(function(g){return !g.section;}).reduce(function(a,g){return a+g.names.length;},0);
  var has=Object.keys(A.classes).length>0;
  $('mBody').innerHTML='<div class="note" style="margin-bottom:12px">سيتم استيراد <b>'+r.total+' طالباً</b> في <b>'+r.groups.filter(function(g){return g.section;}).length+' فصلاً</b>. يُحفظ اسم الطالب وفصله فقط.</div>'+
    Object.keys(byG).sort(function(a,b){return gradeRank(a)-gradeRank(b);}).map(function(g){
      return '<div style="margin-bottom:8px"><b style="color:var(--gd)">'+esc(g)+'</b><div class="muted">'+
        byG[g].map(function(x){return (x.section?'فصل '+esc(x.section):'بدون فصل')+' ('+x.names.length+')';}).join(' • ')+'</div></div>';
    }).join('')+
    (noSec?'<div class="note warn" style="margin-top:8px">'+noSec+' طالب غير مسجّل في فصل داخل نور، سيوضع في «بدون فصل» لتنقله لاحقاً.</div>':'')+
    (has?'<div class="note" style="margin-top:10px"><b>توجد صفوف مسجّلة مسبقاً.</b><br>• <b>استبدال:</b> يحذف الطلاب الحاليين ويضع كشف الملف مكانهم (يبقى جدول الحصص كما هو).<br>• <b>إضافة:</b> يضيف الطلاب الجدد فقط دون حذف أحد.</div>':'');
  $('mFoot').innerHTML=has
    ?'<button class="btn" onclick="applyImport(\'replace\')">استبدال</button><button class="btn btn-o" onclick="applyImport(\'merge\')">إضافة الطلاب الجدد فقط</button><button class="btn btn-o" onclick="closeModal()">إلغاء</button>'
    :'<button class="btn" onclick="applyImport(\'replace\')">📥 استيراد</button><button class="btn btn-o" onclick="closeModal()">إلغاء</button>';
}
function applyImport(mode){
  var byKey={};
  Object.keys(A.classes).forEach(function(id){var c=A.classes[id];byKey[c.grade+'|'+(c.section||'')]=id;});
  var next=mode==='replace'?{}:JSON.parse(JSON.stringify(A.classes));
  _import.groups.forEach(function(g){
    var id=byKey[g.grade+'|'+g.section]||rid(8);
    if(mode==='replace'||!next[id]){
      next[id]={grade:g.grade,section:g.section,students:g.names.map(function(n){return {id:rid(8),name:n};})};
    } else {
      var st=toArr(next[id].students);
      g.names.forEach(function(n){if(!st.some(function(s){return s.name===n;}))st.push({id:rid(8),name:n});});
      next[id].students=st;
    }
  });
  $('mFoot').innerHTML='<button class="btn" disabled>جاري الحفظ...</button>';
  wr('att_classes/'+A.code,next).then(function(){
    A.classes=next;closeModal();renderAdmin();toast('تم استيراد '+_import.total+' طالباً ✓');
  }).catch(function(){toast('تعذّر الحفظ',true);renderImportPreview();});
}

var SEND={open:false,mode:'remind',p:null,q:null,i:0,sent:{},viewing:null};
function openSend(p){
  SEND.open=true;SEND.mode='remind';SEND.p=p||targetAttPeriod(A.S);SEND.q=null;SEND.i=0;SEND.sent={};SEND.viewing=null;
  openModal('إرسال الروابط','<div class="empty"><div class="spin"></div></div>');
  ensureAllKeys(A.teachers).then(renderSendBody).catch(function(){$('mBody').innerHTML='<div class="empty">تعذّر الاتصال</div>';});
}
function sendMode(m){SEND.mode=m;SEND.q=null;SEND.i=0;renderSendBody();}
function sendPeriod(p){SEND.p=p;SEND.q=null;SEND.i=0;renderSendBody();}
function renderSendBody(){
  if(!SEND.open||$('modal').classList.contains('hidden'))return;
  if(SEND.viewing) return viewRecord(SEND.viewing.p,SEND.viewing.cid);
  var html='<div class="seg" style="margin-bottom:12px"><button class="'+(SEND.mode==='remind'?'on':'')+'" onclick="sendMode(\'remind\')">تذكير بالتحضير</button>'+
    '<button class="'+(SEND.mode==='all'?'on':'')+'" onclick="sendMode(\'all\')">الروابط الدائمة</button></div>';
  var items;
  if(SEND.mode==='remind'){
    var d=selDow(),live=isToday(),dd=parseKey(A.day);
    html+='<div class="seg" style="margin-bottom:12px;margin-inline-start:6px">'+A.S.att.map(function(p){return '<button class="'+(SEND.p===p?'on':'')+'" onclick="sendPeriod('+p+')">'+pLabel(p)+'</button>';}).join('')+'</div>';
    if(d<0){$('mBody').innerHTML=html+'<div class="empty"><span class="e">🌙</span>يوم إجازة، لا توجد حصص.</div>';$('mFoot').innerHTML='';return;}
    items=expectedFor(SEND.p,d);
    // فصول حُضّرت دون أن تكون في الجدول (حصة انتظار)
    var recs=(A.rec&&A.rec['p'+SEND.p])||{};
    Object.keys(recs).forEach(function(cid){
      if(!items.some(function(x){return x.cid===cid;})) items.push({t:findT(recs[cid].tid)||{id:recs[cid].tid,name:recs[cid].teacher},cid:cid,sub:true});
    });
    if(!items.length){$('mBody').innerHTML=html+'<div class="empty"><span class="e">📅</span>لا يوجد معلمون لديهم '+pLabel(SEND.p)+' في هذا اليوم.</div>';$('mFoot').innerHTML='';return;}
    var pending=items.filter(function(x){return !recFor(SEND.p,x.cid);});
    html+='<div class="note" style="margin-bottom:10px">'+DAYS[d]+' '+dd.getDate()+'/'+(dd.getMonth()+1)+' — '+pLabel(SEND.p)+': حُضّر <b>'+(items.length-pending.length)+'</b> من <b>'+items.length+'</b> فصلاً.'+
      (!pending.length?' ✅ اكتمل التحضير.':live?' يمكنك تذكير من لم يحضّر بإرسال الرابط له.':'')+'</div>';
    html+='<div class="card plist">'+items.map(function(x){
      var r=recFor(SEND.p,x.cid);
      var badge=r?'<span class="badge ok">✅ '+hm(r.at)+'</span>':!live?'<span class="badge no">لم يُحضَّر</span>':SEND.sent[x.t.id]?'<span class="badge">✓ أُرسل</span>':'<span class="badge warn">⏳ لم يحضّر</span>';
      var btn=r?'<button class="btn btn-l btn-sm" onclick="viewRecord('+SEND.p+',\''+x.cid+'\')">عرض</button>':live?'<button class="ib" title="واتساب" onclick="sendOne(\''+x.t.id+'\',\''+x.cid+'\')">📲</button>':'';
      return '<div class="row"><div class="main"><div class="nm">'+esc(x.t.name)+'</div><div class="sub">'+esc(clsName(A.classes[x.cid]))+(x.sub?' • حصة انتظار':'')+'</div></div>'+badge+btn+'</div>';
    }).join('')+'</div>';
    SEND.list=live?pending.map(function(x){return {tid:String(x.t.id),cid:x.cid};}):[];
  } else {
    html+='<div class="note" style="margin-bottom:10px">أرسل لكل معلم رابطه الدائم <b>مرة واحدة</b> في بداية العام أو عند إضافة معلم جديد. بعدها يفتحه المعلم في كل حصة تحضير دون الحاجة لإرسال يومي.</div>';
    html+='<div class="card plist">'+A.teachers.map(function(t){
      return '<div class="row"><div class="main"><div class="nm">'+esc(t.name)+'</div><div class="sub">'+(t.phone?esc(t.phone):'⚠️ بدون رقم جوال')+'</div></div>'+
        (SEND.sent[t.id]?'<span class="badge ok">✓ أُرسل</span>':'')+'<button class="ib" onclick="sendOne(\''+t.id+'\')">📲</button></div>';
    }).join('')+'</div>';
    SEND.list=A.teachers.map(function(t){return {tid:String(t.id)};});
  }
  $('mBody').innerHTML=html;
  // الإرسال المتتابع: كل ضغطة تفتح رسالة واتساب واحدة جاهزة
  var q=SEND.q;
  if(q&&SEND.i<q.length){
    var nx=findT(q[SEND.i].tid);
    $('mFoot').innerHTML='<button class="btn btn-g btn-w" onclick="sendNext()">📲 إرسال إلى: '+esc(nx?nx.name:'')+' ('+(SEND.i+1)+' من '+q.length+')</button>';
  } else if(q){
    $('mFoot').innerHTML='<div class="note" style="width:100%;background:var(--okb);border-color:#bfe5cd;color:var(--ok)">✅ تم فتح الرسائل لجميع المعلمين في القائمة.</div>';
  } else if(SEND.list.length){
    $('mFoot').innerHTML='<button class="btn btn-g btn-w" onclick="SEND.q=SEND.list.slice();SEND.i=0;renderSendBody()">📤 '+(SEND.mode==='remind'?'تذكير غير المحضّرين':'إرسال لجميع المعلمين')+' ('+SEND.list.length+')</button>';
  } else $('mFoot').innerHTML='';
}
// عرض تحضير فصل كما أرسله المعلم، داخل نافذة الإرسال نفسها
function viewRecord(p,cid){
  var r=recFor(p,cid),c=A.classes[cid];
  if(!r){SEND.viewing=null;return renderSendBody();}

    '<div class="card">'+rows.map(function(x,i){
      return '<div class="srow st-'+x.s+'"><span class="i">'+(i+1)+'</span><span class="n">'+esc(x.n)+'</span><b class="chip c-'+x.s+'">'+STN[x.s]+'</b></div>';

function backToSend(){SEND.viewing=null;$('mTitle').textContent='إرسال الروابط';renderSendBody();}
function printRecordClass(cid){
  var c=A.classes[cid];
  printDoc('كشف تحضير - '+clsName(c)+' - '+A.day,pageClass(Object.assign({id:cid},c),A.rec,parseKey(A.day)));
}
function sendOne(tid,cid){
  var t=findT(tid);if(!t)return;
  waOpen(t.phone,SEND.mode==='remind'&&cid?msgReminder(t,cid,SEND.p):msgPermanent(t));

}
function sendNext(){
  var it=SEND.q[SEND.i];SEND.i++;
  sendOne(it.tid,it.cid);
}

// ---------- تصدير PDF ----------
function openExport(){
  var opts='<option value="">كل الفصول</option>'+sortedClasses(A.classes).map(function(c){return '<option value="'+c.id+'">'+esc(clsName(c))+'</option>';}).join('');
  openModal('تصدير PDF',
    '<div class="fld"><label class="f">التاريخ</label><input type="date" id="fExD" value="'+A.day+'" max="'+dateKey()+'"></div>'+
    '<div class="fld"><label class="f">نوع التقرير</label><select id="fExT" onchange="$(\'fExCW\').classList.toggle(\'hidden\',this.value===\'daily\')">'+
      '<option value="both">الاثنان معاً</option><option value="classes">كشف تحضير الفصول (صفحة لكل فصل)</option><option value="daily">التقرير اليومي للغياب والتأخر</option></select></div>'+
    '<div class="fld" id="fExCW"><label class="f">الفصل</label><select id="fExC">'+opts+'</select></div>'+
    '<div class="note">ستفتح نافذة الطباعة، اختر منها <b>«حفظ بصيغة PDF»</b>.</div>',
    '<button class="btn" id="exBtn" onclick="doExport()">📄 تصدير</button><button class="btn btn-o" onclick="closeModal()">إلغاء</button>');
}
function doExport(){
  var dk=$('fExD').value||dateKey(),type=$('fExT').value,cid=$('fExC').value;
  $('exBtn').disabled=true;$('exBtn').textContent='جاري التحضير...';
  rd('att_records/'+A.code+'/'+dk).then(function(rec){
    rec=rec||{};
    var d=parseKey(dk),parts=[];
    if(type!=='daily'){
      var cls=sortedClasses(A.classes).filter(function(c){return !cid||c.id===cid;});
      cls.forEach(function(c){parts.push(pageClass(c,rec,d));});
    }
    if(type!=='classes') parts.push(pageDaily(rec,d));
    closeModal();
    printDoc('سجل الغياب والتأخر - '+dk,parts.join(''));
  }).catch(function(){toast('تعذّر الاتصال',true);$('exBtn').disabled=false;$('exBtn').textContent='📄 تصدير';});
}
function pHead(title,sub,d){
  return '<div class="ph"><div class="ph-r">المملكة العربية السعودية<br>وزارة التعليم<br><b>'+esc(A.schoolName)+'</b></div>'+
    '<div class="ph-c"><h1>'+title+'</h1><div>'+sub+'</div></div>'+
    '<div class="ph-l"><img src="'+new URL('logo.png',location.href).href+'"><div>'+fmtDay(d)+'<br>'+fmtHijri(d)+'<br>'+fmtGreg(d)+'</div></div></div>';
}
function rowsMap(r){var m={};toArr(r&&r.rows).forEach(function(x){m[x.id]=x;});return m;}
function stCell(x){return x?'<td class="s-'+x.s+'">'+STN[x.s]+'</td>':'<td class="s-n">—</td>';}
function pageClass(c,rec,d){
  var att=A.S.att,recs=att.map(function(p){return rec['p'+p]&&rec['p'+p][c.id];}),maps=recs.map(rowsMap);
  var list=toArr(c.students).map(function(s){return {id:s.id,n:s.name};});
  maps.forEach(function(m){Object.keys(m).forEach(function(id){if(!list.some(function(s){return s.id===id;}))list.push({id:id,n:m[id].n});});});
  var cnt=att.map(function(p,i){var o={p:0,l:0,a:0};Object.keys(maps[i]).forEach(function(id){o[maps[i][id].s]++;});return o;});
  return '<section class="page">'+pHead('كشف تحضير الطلاب','الصف: <b>'+esc(clsName(c))+'</b>',d)+
    '<table><thead><tr><th style="width:36px">م</th><th>اسم الطالب</th>'+att.map(function(p){return '<th style="width:110px">'+pLabel(p)+'</th>';}).join('')+'</tr></thead><tbody>'+
    list.map(function(s,i){return '<tr><td>'+(i+1)+'</td><td class="nm">'+esc(s.n)+'</td>'+maps.map(function(m){return stCell(m[s.id]);}).join('')+'</tr>';}).join('')+
    '</tbody></table>'+
    '<table class="sum"><tr>'+att.map(function(p,i){
      var r=recs[i];
      return '<td><b>'+pLabel(p)+':</b> '+(r?'حاضر '+cnt[i].p+' • متأخر '+cnt[i].l+' • غائب '+cnt[i].a+'<br><span class="mut">المعلم: '+esc(r.teacher||'')+' — الساعة '+hm(r.at)+'</span>':'<span class="s-n">لم يُحضَّر</span>')+'</td>';
    }).join('')+'</tr></table>'+
    '<div class="sig"><div>وكيل شؤون الطلاب: ....................<br>التوقيع: ....................</div><div>مدير المدرسة: ....................<br>التوقيع: ....................</div></div></section>';
}
function pageDaily(rec,d){
  var att=A.S.att,cls=sortedClasses(A.classes).filter(function(c){return c.section;});
  var abs={},late={};
  var summary=cls.map(function(c){
    var cells=att.map(function(p){
      var r=rec['p'+p]&&rec['p'+p][c.id];
      if(!r) return '<td class="s-n">لم يُحضَّر</td>';
      var a=0,l=0;
      toArr(r.rows).forEach(function(x){
        var key=c.id+'|'+x.id;
        if(x.s==='a'){a++;(abs[key]=abs[key]||{n:x.n,c:c,ps:[]}).ps.push(p);}
        if(x.s==='l'){l++;(late[key]=late[key]||{n:x.n,c:c,ps:[]}).ps.push(p);}
      });
      return '<td>غائب <b class="s-a">'+a+'</b> • متأخر <b class="s-l">'+l+'</b></td>';
    }).join('');
    return '<tr><td class="nm">'+esc(clsName(c))+'</td><td>'+toArr(c.students).length+'</td>'+cells+'</tr>';
  }).join('');
  function listTbl(obj,title,cls){
    var ks=Object.keys(obj);
    if(!ks.length) return '<h3>'+title+'</h3><p class="mut">لا يوجد.</p>';
    return '<h3>'+title+' ('+ks.length+')</h3><table><thead><tr><th style="width:36px">م</th><th>اسم الطالب</th><th style="width:170px">الفصل</th><th style="width:170px">الحصة</th></tr></thead><tbody>'+
      ks.map(function(k,i){var x=obj[k];return '<tr><td>'+(i+1)+'</td><td class="nm">'+esc(x.n)+'</td><td>'+esc(clsName(x.c))+'</td><td class="'+cls+'">'+x.ps.map(pLabel).join(' و')+'</td></tr>';}).join('')+'</tbody></table>';
  }
  return '<section class="page">'+pHead('التقرير اليومي للغياب والتأخر','جميع فصول المدرسة',d)+
    '<table><thead><tr><th>الفصل</th><th style="width:60px">الطلاب</th>'+att.map(function(p){return '<th>'+pLabel(p)+'</th>';}).join('')+'</tr></thead><tbody>'+summary+'</tbody></table>'+
    listTbl(abs,'الطلاب الغائبون','s-a')+listTbl(late,'الطلاب المتأخرون','s-l')+
    '<div class="sig"><div>وكيل شؤون الطلاب: ....................<br>التوقيع: ....................</div><div>مدير المدرسة: ....................<br>التوقيع: ....................</div></div></section>';
}
function printDoc(title,inner,extraCss){
  var css='@page{size:A4;margin:11mm}*{box-sizing:border-box}body{font-family:Cairo,Tahoma,sans-serif;direction:rtl;color:#1a2a4a;font-size:11.5px;margin:0}'+
    '.page{page-break-after:always}.page:last-child{page-break-after:auto}'+
    '.ph{display:flex;justify-content:space-between;align-items:center;border-bottom:2.5px solid #1a3a6b;padding-bottom:8px;margin-bottom:12px;gap:10px}'+
    '.ph-r{font-size:11px;line-height:1.7;width:32%}.ph-c{text-align:center;flex:1}.ph-c h1{font-size:17px;color:#1a3a6b;margin:0 0 3px}.ph-c div{font-size:13px}'+
    '.ph-l{width:32%;text-align:left;font-size:10.5px;line-height:1.6;display:flex;align-items:center;gap:8px;justify-content:flex-end}.ph-l img{height:58px}'+
    'table{width:100%;border-collapse:collapse;margin-bottom:10px}th{background:#1a3a6b;color:#fff;padding:5px;font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}'+
    'td{border:1px solid #c9d2e3;padding:4px 6px;text-align:center}td.nm{text-align:right}tr:nth-child(even) td{background:#f7f9fc;-webkit-print-color-adjust:exact;print-color-adjust:exact}'+
    '.s-p{color:#1a7a4a}.s-l{color:#8a5a00;font-weight:700}.s-a{color:#b42318;font-weight:700}.s-n{color:#9aa6bd}.mut{color:#7a8aab;font-size:10.5px}'+
    '.sum td{text-align:right;background:#fff!important;line-height:1.8}h3{font-size:13px;color:#1a3a6b;margin:12px 0 6px}'+
    '.sig{display:flex;justify-content:space-between;margin-top:22px;font-size:12px;line-height:2.2}'+(extraCss||'');
  var html='<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>'+esc(title)+'</title>'+
    '<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet"><style>'+css+'</style></head><body>'+inner+'</body></html>';
  var f=document.createElement('iframe');
  f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(f);
  var doc=f.contentWindow.document;doc.open();doc.write(html);doc.close();
  var old=document.title;document.title=title;
  var cleanup=function(){document.title=old;if(f.parentNode)f.parentNode.removeChild(f);};
  var go=function(){
    f.contentWindow.addEventListener('afterprint',function(){setTimeout(cleanup,500);});
    f.contentWindow.focus();f.contentWindow.print();
    setTimeout(cleanup,120000);
  };
  var fontsReady=(doc.fonts&&doc.fonts.ready)?doc.fonts.ready:Promise.resolve();
  Promise.race([fontsReady,new Promise(function(r){setTimeout(r,2500);})]).then(function(){setTimeout(go,300);});
}

// ---------- الخطة الأسبوعية (مشتركة مع المنصة: pt_{code}/submissions) ----------
function curWeekName(){var i=weekOf(A.day);return i<0?'':WEEKS[i][0];}
function loadPlans(){
  $('secPlan').innerHTML='<div class="card empty"><div class="spin"></div></div>';
  rd('pt_'+A.code+'/submissions').then(function(s){A.subs=toArr(s);renderPlans();})
    .catch(function(){$('secPlan').innerHTML='<div class="card empty"><span class="e">⚠️</span>تعذّر الاتصال</div>';});
}
// أسماء الأسابيع تتكرر كل فصل، فنعرض فقط ما رُفع منذ بداية الفصل الحالي
function weekPlans(){
  var wk=curWeekName(),start=WEEKS[0][1];
  return A.subs.map(function(s,i){return Object.assign({_i:i},s);}).filter(function(s){
    var w=String(s.week||'');try{w=decodeURIComponent(w);}catch(e){}
    return w.trim()===wk&&(s.date||'')>=start;
  });
}
function renderPlans(){
  if(A.sec!=='plan') return;
  var wk=curWeekName(),subs=weekPlans();
  var sent=subs.map(function(s){return normName(s.teacherName);});
  var notSent=A.teachers.filter(function(t){return sent.indexOf(normName(t.name))<0;});
  var pct=A.teachers.length?Math.round(subs.length*100/A.teachers.length):0;
  var html='<div class="card sv-card"><div class="sv-head"><div><div class="nm">📚 خطط '+esc(wk)+'</div>'+
      '<div class="muted">استلمت <b>'+subs.length+'</b> خطة • لم يرسل <b>'+notSent.length+'</b> معلماً</div></div>'+
      '<div class="ops"><button class="btn btn-g btn-sm" onclick="sendPlanLink()">📱 إرسال رابط الخطة</button>'+
      '<button class="btn btn-o btn-sm" onclick="exportPlans()">📄 تصدير PDF</button></div></div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  html+='<div class="card">'+
    subs.map(function(s){
      var t=A.teachers.find(function(x){return normName(x.name)===normName(s.teacherName);});
      var hasFile=s.fileUrl||s.fileData;
      return '<div class="row"><div class="main"><div class="nm">'+esc(s.teacherName)+'</div><div class="sub">'+esc(s.teacherSubject||(t&&t.subject)||'')+' • '+esc(s.date||'')+'</div></div>'+
        '<span class="badge ok">✓ أرسل</span>'+
        (hasFile?'<button class="btn btn-l btn-sm" onclick="viewPlanFile('+s._i+')">عرض</button><button class="btn btn-o btn-sm" onclick="downloadPlanFile('+s._i+')">تحميل</button>':'')+'</div>';
    }).join('')+
    notSent.map(function(t){
      return '<div class="row"><div class="main"><div class="nm">'+esc(t.name)+'</div><div class="sub">'+esc(t.subject||'')+'</div></div>'+
        '<span class="badge warn">✗ لم يرسل</span>'+
        (t.phone?'<button class="ib" title="تذكير بالواتساب" onclick="remindPlan(\''+t.id+'\')">📲</button>':'')+'</div>';
    }).join('')+
    (subs.length||notSent.length?'':'<div class="empty">لا يوجد معلمون</div>')+'</div>';
  $('secPlan').innerHTML=html;
}
function planLink(){return platformBase()+'#upload='+A.code+'&week='+encodeURIComponent(curWeekName());}
function sendPlanLink(){
  waOpen('','السلام عليكم ،\nيرجى رفع خطة الدروس لـ'+curWeekName()+' عبر:\n'+planLink()+'\nإدارة '+A.schoolName);
}
function remindPlan(tid){
  var t=findT(tid);if(!t)return;
  waOpen(t.phone,'تذكير: '+t.name+'، لم يتم استلام خطة الدروس لـ'+curWeekName()+'. يرجى الرفع عبر:\n'+planLink()+'\nإدارة '+A.schoolName);
}
// نفس طريقة المنصة: ملفات PDF على Cloudinary تُعرض كصورة
function viewPlanFile(i){
  var s=A.subs[i];if(!s)return;
  if(s.fileUrl){
    var url=s.fileUrl;
    if(url.indexOf('cloudinary.com')!==-1&&url.indexOf('/image/upload/')!==-1&&url.toLowerCase().indexOf('.pdf')!==-1)
      url=url.replace('/image/upload/','/image/upload/f_jpg,q_90/').replace(/\.pdf$/i,'.jpg');
    window.open(url,'_blank');
  } else if(s.fileData){
    var w=window.open('','_blank');
    w.document.write('<html><body style="margin:0"><iframe src="'+s.fileData+'" style="border:none;position:fixed;inset:0;width:100%;height:100%"></iframe></body></html>');
    w.document.close();
  }
}
function downloadPlanFile(i){
  var s=A.subs[i];if(!s)return;
  if(s.fileData){var a=document.createElement('a');a.href=s.fileData;a.download=s.teacherName+'_خطة.pdf';a.click();return;}
  var url=s.fileUrl;
  if(url.indexOf('cloudinary.com')!==-1){
    if(url.indexOf('/image/upload/')===-1){toast('هذا الملف القديم لا يمكن تحميله، اطلب إعادة رفعه',true);return;}
    url=url.replace('/image/upload/','/image/upload/fl_attachment,f_jpg/').replace(/\.[^.]+$/,'.jpg');
  }
  fetch(url).then(function(r){return r.blob();}).then(function(b){
    var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=s.teacherName+'_خطة.jpg';
    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},5000);
  }).catch(function(){toast('تعذّر تحميل الملف',true);});
}
function exportPlans(){
  var wk=curWeekName(),subs=weekPlans(),sent=subs.map(function(s){return normName(s.teacherName);});
  var notSent=A.teachers.filter(function(t){return sent.indexOf(normName(t.name))<0;});
  var d=parseKey(A.day);
  printDoc('تقرير الخطة الأسبوعية - '+wk,'<section class="page">'+pHead('تقرير الخطة الأسبوعية',esc(wk),d)+
    '<h3>أولاً: المعلمون الذين أرسلوا ('+subs.length+')</h3><table><thead><tr><th style="width:36px">م</th><th>الاسم</th><th>التخصص</th><th style="width:110px">التاريخ</th></tr></thead><tbody>'+
    subs.map(function(s,i){return '<tr><td>'+(i+1)+'</td><td class="nm">'+esc(s.teacherName)+'</td><td>'+esc(s.teacherSubject||'')+'</td><td>'+esc(s.date||'')+'</td></tr>';}).join('')+'</tbody></table>'+
    '<h3>ثانياً: لم يرسلوا ('+notSent.length+')</h3><table><thead><tr><th style="width:36px">م</th><th>الاسم</th><th>التخصص</th></tr></thead><tbody>'+
    notSent.map(function(t,i){return '<tr><td>'+(i+1)+'</td><td class="nm s-a">'+esc(t.name)+'</td><td>'+esc(t.subject||'')+'</td></tr>';}).join('')+'</tbody></table>'+
    '<div class="sig"><div>وكيل الشؤون التعليمية: ....................<br>التوقيع: ....................</div><div>مدير المدرسة: ....................<br>التوقيع: ....................</div></div></section>');
}

// ---------- الاستبانات (مشتركة مع المنصة: pt_{code}/surveys) ----------
function loadSurveys(){
  $('secSurv').innerHTML='<div class="card empty"><div class="spin"></div></div>';
  Promise.all([rd('pt_'+A.code+'/surveys'),rd('att_forms/'+A.code),rd('att_resp/'+A.code)]).then(function(r){
    A.survs=toArr(r[0]);A.forms=r[1]||{};A.resps=r[2]||{};
    return ensureTplForms();
  }).then(renderSurveys).catch(function(){$('secSurv').innerHTML='<div class="card empty"><span class="e">⚠️</span>تعذّر الاتصال</div>';});
}
function saveSurveys(){return wr('pt_'+A.code+'/surveys',A.survs);}
function findSurv(id){return A.survs.find(function(s){return String(s.id)===String(id);});}
function survTargets(s){var ids=toArr(s.targetIds).map(String);return A.teachers.filter(function(t){return ids.indexOf(String(t.id))>=0;});}
function survDone(s,t){return toArr(s.completions).find(function(c){return String(c.tid)===String(t.id);});}
// تبويب الاستبانات: جاهزة (نماذج داخل التطبيق) أو برابط خارجي (مشتركة مع المنصة)
function renderSurveys(){
  if(A.sec!=='surv') return;
  if(A.svDash) return renderDash(A.svDash);
  var seg='<div class="seg" style="margin-bottom:12px"><button class="'+(A.svTab!=='ext'?'on':'')+'" onclick="A.svTab=\'ready\';renderSurveys()">📋 الاستبانات الجاهزة</button>'+
    '<button class="'+(A.svTab==='ext'?'on':'')+'" onclick="A.svTab=\'ext\';renderSurveys()">🔗 استبانات برابط خارجي</button></div>';
  if(A.svTab==='ext') return renderExtSurveys(seg);
  renderReady(seg);
}
function renderExtSurveys(seg){
  var html=seg+'<div class="toolbar"><div class="grow muted">'+A.survs.length+' استبانة • مشتركة مع منصة رابط</div>'+
    '<button class="btn" onclick="newSurvey()">➕ استبانة جديدة</button></div>';
  if(!A.survs.length){
    $('secSurv').innerHTML=html+'<div class="card empty"><span class="e">📝</span>لا توجد استبانات بعد.<br>صمّم الاستبانة في Google Forms أو Microsoft Forms، ثم أضف رابطها هنا لترسله للمعلمين وتتابع من عبّأها.</div>';
    return;
  }
  html+=A.survs.slice().reverse().map(function(s){
    var tg=survTargets(s),done=tg.filter(function(t){return survDone(s,t);}).length,pct=tg.length?Math.round(done*100/tg.length):0;
    return '<div class="card sv-card"><div class="sv-head"><div><div class="nm">📝 '+esc(s.title)+'</div><div class="muted">'+esc(s.date||'')+' • '+tg.length+' مستلماً</div></div>'+
      '<div class="ops"><button class="btn btn-g btn-sm" onclick="sendSurvey(\''+s.id+'\')">📱 إرسال</button>'+
      '<button class="btn btn-l btn-sm" onclick="surveyDetails(\''+s.id+'\')">عرض</button>'+
      '<button class="ib del" title="حذف" onclick="deleteSurvey(\''+s.id+'\')">🗑️</button></div></div>'+
      '<div class="chips"><span class="chip c-p">✓ عبّأ '+done+'</span><span class="chip c-a">✗ لم يعبئ '+(tg.length-done)+'</span><span class="chip" style="background:var(--gp);color:var(--gd)">'+pct+'%</span></div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  }).join('');
  $('secSurv').innerHTML=html;
}
function newSurvey(){
  openModal('استبانة جديدة',
    '<div class="fld"><label class="f">عنوان الاستبانة *</label><input type="text" id="fSvT" placeholder="مثال: استبانة تقييم الأداء الوظيفي"></div>'+
    '<div class="fld"><label class="f">رابط الاستبانة *</label><input type="text" id="fSvU" dir="ltr" placeholder="https://forms.google.com/..."></div>'+
    '<label class="f">المستلمون</label>'+
    '<label class="chk" style="font-weight:800;color:var(--gd)"><input type="checkbox" id="fSvAll" onchange="document.querySelectorAll(\'.fSvT\').forEach(function(c){c.checked=$(\'fSvAll\').checked;})"> تحديد الكل ('+A.teachers.length+')</label>'+
    '<div style="max-height:240px;overflow-y:auto;border:1px solid #eef1f6;border-radius:9px;padding:0 8px">'+
    A.teachers.map(function(t){return '<label class="chk"><input type="checkbox" class="fSvT" value="'+t.id+'"> '+esc(t.name)+'<span class="muted" style="margin-inline-start:auto">'+esc(t.subject||'')+'</span></label>';}).join('')+
    '</div><div class="err" id="fSvErr"></div>',
    '<button class="btn" onclick="saveNewSurvey()">حفظ</button><button class="btn btn-o" onclick="closeModal()">إلغاء</button>');
}
function saveNewSurvey(){
  var title=$('fSvT').value.trim(),url=$('fSvU').value.trim();
  var ids=[];document.querySelectorAll('.fSvT:checked').forEach(function(c){ids.push(isNaN(+c.value)?c.value:+c.value);});
  if(!title){$('fSvErr').textContent='يرجى إدخال عنوان الاستبانة';return;}
  if(!/^https?:\/\//i.test(url)){$('fSvErr').textContent='يرجى إدخال رابط صحيح يبدأ بـ https://';return;}
  if(!ids.length){$('fSvErr').textContent='اختر مستلماً واحداً على الأقل';return;}
  A.survs.push({id:Date.now(),title:title,url:url,date:dateKey(),targetIds:ids});
  saveSurveys().then(function(){closeModal();renderSurveys();toast('تم إضافة الاستبانة ✓');}).catch(function(){A.survs.pop();toast('تعذّر الحفظ',true);});
}
// رسالة واحدة فيها رابط خاص لكل مستلم، كما في المنصة
function sendSurvey(id){
  var s=findSurv(id),tg=survTargets(s);
  if(!tg.length){toast('لا يوجد مستلمون',true);return;}
  var lines=tg.map(function(t){return t.name+':\n'+platformBase()+'#survey='+A.code+'|'+s.id+'|'+t.id;}).join('\n\n');
  waOpen('','السلام عليكم ،\nيرجى تعبئة الاستبانة التالية:\n'+s.title+'\n\n'+lines+'\n\nإدارة '+A.schoolName);
}
function surveyDetails(id){
  var s=findSurv(id),tg=survTargets(s);
  var done=tg.filter(function(t){return survDone(s,t);}),not=tg.filter(function(t){return !survDone(s,t);});
  openModal(s.title,
    '<div class="chips"><span class="chip c-p">✓ عبّأ '+done.length+'</span><span class="chip c-a">✗ لم يعبئ '+not.length+'</span></div>'+
    '<div class="card">'+done.map(function(t){return '<div class="srow"><span class="n">'+esc(t.name)+'</span><b class="chip c-p">✓ '+esc(survDone(s,t).date||'')+'</b></div>';}).join('')+
    not.map(function(t){return '<div class="srow st-a"><span class="n">'+esc(t.name)+'</span><b class="chip c-a">لم يعبئ</b></div>';}).join('')+'</div>'+
    '<a href="'+esc(s.url)+'" target="_blank" class="muted" style="display:inline-block;margin-top:10px">🔗 فتح الاستبانة</a>',
    '<button class="btn" onclick="exportSurvey(\''+s.id+'\')">📄 تصدير PDF</button><button class="btn btn-o" onclick="closeModal()">إغلاق</button>');
}
function exportSurvey(id){
  var s=findSurv(id),tg=survTargets(s);
  var done=tg.filter(function(t){return survDone(s,t);}),not=tg.filter(function(t){return !survDone(s,t);});
  printDoc('تقرير استبانة - '+s.title,'<section class="page">'+pHead('تقرير الاستبانة',esc(s.title),new Date())+
    '<h3>من عبّأ الاستبانة ('+done.length+')</h3><table><thead><tr><th style="width:36px">م</th><th>الاسم</th><th style="width:120px">التاريخ</th></tr></thead><tbody>'+
    done.map(function(t,i){return '<tr><td>'+(i+1)+'</td><td class="nm">'+esc(t.name)+'</td><td>'+esc(survDone(s,t).date||'')+'</td></tr>';}).join('')+'</tbody></table>'+
    '<h3>لم يعبئ الاستبانة ('+not.length+')</h3><table><thead><tr><th style="width:36px">م</th><th>الاسم</th><th>التخصص</th></tr></thead><tbody>'+
    not.map(function(t,i){return '<tr><td>'+(i+1)+'</td><td class="nm s-a">'+esc(t.name)+'</td><td>'+esc(t.subject||'')+'</td></tr>';}).join('')+'</tbody></table></section>');
}
function deleteSurvey(id){
  var s=findSurv(id);
  if(!confirm('حذف استبانة «'+s.title+'»؟ ستُحذف من المنصة أيضاً.'))return;
  A.survs=A.survs.filter(function(x){return x!==s;});
  saveSurveys().then(function(){renderSurveys();toast('تم الحذف');});
}

// =====================================================================
//  الاستبانات الجاهزة: att_forms/{school}/{fid} ، الردود att_resp/{school}/{fid}/{push}
// =====================================================================
// ألوان المقياس: أزرق للموافقة، أحمر للرفض، ورمادي للمحايد/«لا أعرف»
var LK_COLORS={2:['#1c5cab','#c93b3a'],3:['#1c5cab','#d3d2cb','#c93b3a'],4:['#1c5cab','#86b6ef','#f0908f','#c93b3a'],5:['#1c5cab','#86b6ef','#d3d2cb','#f0908f','#c93b3a']};
var LK_INK={'#1c5cab':'#fff','#c93b3a':'#fff','#86b6ef':'#0b0b0b','#f0908f':'#0b0b0b','#d3d2cb':'#0b0b0b'};
function formLink(fid){return appBase()+'?s='+A.code+'.'+fid;}
function formResps(fid){return toArr(A.resps&&A.resps[fid]);}
function sortedForms(){
  return Object.keys(A.forms||{}).map(function(k){return Object.assign({id:k},A.forms[k]);})
    .sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
}
// كل استبانة جاهزة لها رابط ثابت منذ البداية (معرّفها = معرّف القالب)، ولا تحتاج «إطلاق».
// إن كانت قد أُطلقت سابقاً برابط آخر يبقى ذلك الرابط الأقدم هو الأساسي حتى لا يتعطل ما أُرسل.
function mainForm(tplId){
  if(A.forms[tplId]) return tplId;
  var ids=Object.keys(A.forms).filter(function(k){return A.forms[k].tpl===tplId&&!A.forms[k].teacher;})
    .sort(function(a,b){return (A.forms[a].createdAt||0)-(A.forms[b].createdAt||0);});
  return ids[0]||null;
}
function ensureTplForms(){
  var add={};
  SURVEY_TPL.forEach(function(t){
    if(t.perTeacher||mainForm(t.id)) return;
    add[t.id]={tpl:t.id,title:t.title,aud:t.aud,createdAt:Date.now(),open:true,schoolName:A.schoolName};
  });
  if(!Object.keys(add).length) return Promise.resolve();
  return DB.ref('att_forms/'+A.code).update(add).then(function(){Object.assign(A.forms,add);});
}
function formCard(fid,isMain){
  var f=A.forms[fid],n=formResps(fid).length,open=f.open!==false;
  return '<div class="card sv-card"><div class="sv-head"><div><div class="nm">'+esc(f.title)+'</div>'+
    '<div class="muted"><span class="aud">'+esc(f.aud||'')+'</span> • '+esc(dateKey(new Date(f.createdAt||0)))+' • '+
    (open?'<b style="color:var(--ok)">● تستقبل الردود</b>':'<b style="color:var(--abs)">⏸ متوقفة</b>')+'</div></div>'+
    '<div style="text-align:left"><div style="font-size:24px;font-weight:800;color:#0b0b0b;line-height:1">'+n+'</div><div class="muted">رداً</div></div></div>'+
    '<div class="ops"><button class="btn btn-sm" onclick="openDash(\''+fid+'\')">📊 النتائج</button>'+
    '<button class="btn btn-g btn-sm" onclick="formLinkModal(\''+fid+'\')">🔗 الرابط</button>'+
    '<button class="btn btn-o btn-sm" onclick="toggleForm(\''+fid+'\')">'+(open?'⏸ إيقاف':'▶ استئناف')+'</button>'+
    (isMain?'<button class="ib del" title="مسح الردود" onclick="resetForm(\''+fid+'\')">🗑️</button>':
      '<button class="ib del" title="حذف هذه النسخة" onclick="deleteForm(\''+fid+'\')">🗑️</button>')+'</div></div>';
}
// تصفية حسب الفئة المستهدفة
var SV_AUDS=[['all','جميع الاستبانات'],['المعلمون','المعلمين'],['الطلاب','الطلاب'],['أولياء الأمور','أولياء الأمور'],['other','أخرى']];
function audKey(aud){return ['المعلمون','الطلاب','أولياء الأمور'].indexOf(aud)>=0?aud:'other';}
function renderReady(seg){
  var cur=A.svAud||'all',shown={};
  var count=function(k){return SURVEY_TPL.filter(function(t){return k==='all'||audKey(t.aud)===k;}).length;};
  var html=seg+'<div class="svf">'+SV_AUDS.map(function(a){
    return '<label class="svf-o'+(cur===a[0]?' on':'')+'"><input type="radio" name="svAud"'+(cur===a[0]?' checked':'')+
      ' onchange="A.svAud=\''+a[0]+'\';renderSurveys()"> '+a[1]+' <span class="muted">('+count(a[0])+')</span></label>';
  }).join('')+'</div>';
  var list=SURVEY_TPL.filter(function(t){return cur==='all'||audKey(t.aud)===cur;});
  if(list.length) html+='<div style="margin:-6px 2px 12px"><button class="btn btn-o btn-sm" onclick="printAllQR()">🖨️ طباعة رموز QR للاستبانات المعروضة</button></div>';
  if(!list.length) html+='<div class="card empty"><span class="e">📝</span>لا توجد استبانات في هذه الفئة بعد.</div>';
  list.forEach(function(t){
    if(t.perTeacher){
      // استبانة «رضا الطالب عن المعلم»: نسخة مستقلة لكل معلم
      html+='<div class="card sv-card" style="border-style:dashed"><div class="sv-head"><div><div class="nm">'+esc(t.title)+'</div>'+
        '<div class="muted"><span class="aud">'+esc(t.aud)+'</span> • رابط مستقل لكل معلم</div></div></div>'+
        '<div class="ops"><button class="btn btn-sm" onclick="launchForm(\''+t.id+'\')">➕ إنشاء رابط لمعلم</button></div></div>';
      sortedForms().filter(function(f){return f.tpl===t.id;}).forEach(function(f){shown[f.id]=1;html+=formCard(f.id,false);});
      return;
    }
    var main=mainForm(t.id);
    if(main){shown[main]=1;html+=formCard(main,true);}
    // نسخ إضافية أُطلقت سابقاً من القالب نفسه: تُطوى تحت الاستبانة
    var extra=sortedForms().filter(function(f){return f.tpl===t.id&&!shown[f.id];});
    if(extra.length){
      var empty=extra.filter(function(f){return !formResps(f.id).length;}).length;
      html+='<details style="margin:-4px 8px 12px"><summary class="muted" style="cursor:pointer;padding:4px 0">📎 نسخ أخرى من «'+esc(t.title)+'» ('+extra.length+')</summary>'+
        (empty?'<button class="btn btn-r btn-sm" style="margin:6px 0 10px" onclick="deleteEmptyCopies(\''+t.id+'\')">🧹 حذف النسخ التي ليس لها ردود ('+empty+')</button>':'')+
        extra.map(function(f){shown[f.id]=1;return formCard(f.id,false);}).join('')+'</details>';
    }
  });
  $('secSurv').innerHTML=html;
}
function deleteEmptyCopies(tplId){
  var main=mainForm(tplId);
  var ids=Object.keys(A.forms).filter(function(k){return k!==main&&A.forms[k].tpl===tplId&&!A.forms[k].teacher&&!formResps(k).length;});
  if(!ids.length) return;
  if(!confirm('حذف '+ids.length+' نسخة ليس لها أي ردود؟ تبقى الاستبانة الأساسية ورابطها كما هي.'))return;
  var upd={};ids.forEach(function(k){upd[k]=null;});
  DB.ref('att_forms/'+A.code).update(upd).then(function(){ids.forEach(function(k){delete A.forms[k];});renderSurveys();toast('تم حذف '+ids.length+' نسخة');});
}
function resetForm(fid){
  var f=A.forms[fid],n=formResps(fid).length;
  if(!n){toast('لا توجد ردود لمسحها');return;}
  if(!confirm('مسح جميع ردود «'+f.title+'» ('+n+')؟ يبقى الرابط كما هو ويبدأ استقبال الردود من جديد. لا يمكن التراجع.'))return;
  rm('att_resp/'+A.code+'/'+fid).then(function(){if(A.resps)delete A.resps[fid];renderSurveys();toast('تم مسح الردود');});
}
function launchForm(id){
  var t=tplById(id);
  openModal('رابط لمعلم — '+t.title,
    '<div class="fld"><label class="f">المعلم المستهدف *</label><select id="fLnT"><option value="">اختر المعلم</option>'+
    A.teachers.map(function(x){return '<option>'+esc(x.name)+'</option>';}).join('')+'</select></div>'+
    '<input type="hidden" id="fLnTitle" value="'+esc(t.title)+'">'+
    '<div class="note">يُنشأ رابط خاص بهذا المعلم ترسله لطلابه، ونتائجه منفصلة عن بقية المعلمين.</div><div class="err" id="fLnErr"></div>',
    '<button class="btn" onclick="doLaunch(\''+id+'\')">إنشاء الرابط</button><button class="btn btn-o" onclick="closeModal()">إلغاء</button>');
}
function doLaunch(id){
  var t=tplById(id),title=$('fLnTitle').value.trim()||t.title,teacher=t.perTeacher?$('fLnT').value:'';
  if(t.perTeacher&&!teacher){$('fLnErr').textContent='اختر المعلم';return;}
  if(teacher) title+=' — أ. '+teacher;
  var fid=rid(8),f={tpl:id,title:title,aud:t.aud,createdAt:Date.now(),open:true,schoolName:A.schoolName};
  if(teacher) f.teacher=teacher;
  wr('att_forms/'+A.code+'/'+fid,f).then(function(){A.forms[fid]=f;renderSurveys();formLinkModal(fid);})
    .catch(function(){toast('تعذّر الحفظ',true);});
}
function formMsg(fid){
  var f=A.forms[fid];
  return 'السلام عليكم ورحمة الله\nنأمل منكم التكرم بتعبئة استبانة «'+f.title+'» عبر الرابط:\n'+formLink(fid)+'\n\nشاكرين تعاونكم — إدارة '+A.schoolName;
}
function formLinkModal(fid){
  var f=A.forms[fid];
  openModal('رابط الاستبانة','<p style="font-weight:800;color:var(--gd)">'+esc(f.title)+'</p>'+
    '<div id="qrBox" style="width:200px;height:200px;margin:10px auto;display:flex;align-items:center;justify-content:center"><div class="spin"></div></div>'+
    '<div class="muted" style="text-align:center;margin-bottom:6px">امسح الرمز بكاميرا الجوال لفتح الاستبانة</div>'+
    '<div class="linkbox">'+esc(formLink(fid))+'</div><div class="muted">أرسله لـ'+esc(f.aud)+' في مجموعة الواتساب، أو اطبع رمز QR وعلّقه، ويعبئه كل من يفتحه دون تسجيل دخول.</div>',
    '<button class="btn btn-g" onclick="waOpen(\'\',formMsg(\''+fid+'\'))">📲 إرسال بالواتساب</button>'+
    '<button class="btn" onclick="printQR([\''+fid+'\'])">🖨️ طباعة QR</button>'+
    '<button class="btn btn-o" onclick="copyText(formLink(\''+fid+'\'))">📋 نسخ الرابط</button>'+
    '<a class="btn btn-o" href="'+esc(formLink(fid))+'" target="_blank">👁 فتح النموذج</a>');
  loadQR().then(function(){var b=$('qrBox');if(b)b.innerHTML=qrSvg(formLink(fid));})
    .catch(function(){var b=$('qrBox');if(b)b.innerHTML='<span class="muted">تعذّر إنشاء الرمز</span>';});
}
// رموز QR (مكتبة qrcode-generator تُحمّل عند الحاجة فقط)
function loadQR(){return window.qrcode?Promise.resolve():loadScript('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js');}
function qrSvg(text){var q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:4,scalable:true});}
// صفحة A4 لكل استبانة: الترويسة، العنوان، الفئة، رمز كبير، والرابط
function printQR(fids){
  fids=fids.filter(function(k){return A.forms[k];});
  if(!fids.length){toast('لا توجد استبانات للطباعة',true);return;}
  loadQR().then(function(){
    var css='.qr-t{text-align:center;font-size:24px;font-weight:800;color:#1a3a6b;margin:26px 0 6px;line-height:1.5}'+
      '.qr-a{text-align:center;font-size:15px;margin-bottom:18px}.qr-a b{background:#e8f0f8;color:#1a3a6b;padding:3px 14px;border-radius:12px}'+
      '.qr-box{width:115mm;height:115mm;margin:0 auto;border:2px solid #1a3a6b;border-radius:14px;padding:6mm}.qr-box svg{width:100%;height:100%;display:block}'+
      '.qr-h{text-align:center;font-size:17px;font-weight:800;margin-top:16px}.qr-l{text-align:center;direction:ltr;font-size:11px;color:#52514e;margin-top:6px;word-break:break-all}'+
      '.qr-f{text-align:center;font-size:13px;color:#52514e;margin-top:22px}';
    var pages=fids.map(function(k){
      var f=A.forms[k];
      return '<section class="page">'+pHead('استبانة','',new Date())+
        '<div class="qr-t">'+esc(f.title)+'</div><div class="qr-a">موجهة إلى: <b>'+esc(f.aud)+'</b></div>'+
        '<div class="qr-box">'+qrSvg(formLink(k))+'</div>'+
        '<div class="qr-h">📱 امسح الرمز بكاميرا الجوال لتعبئة الاستبانة</div>'+
        '<div class="qr-l">'+esc(formLink(k))+'</div><div class="qr-f">شاكرين تعاونكم — إدارة '+esc(A.schoolName)+'</div></section>';
    }).join('');
    printDoc(fids.length>1?'رموز QR للاستبانات':'QR - '+A.forms[fids[0]].title,pages,css);
  }).catch(function(){toast('تعذّر تحميل مولّد رموز QR، تحقق من الاتصال',true);});
}
// رموز كل الاستبانات المعروضة حسب التصفية الحالية
function printAllQR(){
  var cur=A.svAud||'all',ids=[];
  SURVEY_TPL.filter(function(t){return cur==='all'||audKey(t.aud)===cur;}).forEach(function(t){
    if(t.perTeacher) sortedForms().filter(function(f){return f.tpl===t.id;}).forEach(function(f){ids.push(f.id);});
    else {var m=mainForm(t.id);if(m)ids.push(m);}
  });
  printQR(ids);
}
function toggleForm(fid){
  var f=A.forms[fid],open=f.open===false;
  DB.ref('att_forms/'+A.code+'/'+fid+'/open').set(open).then(function(){f.open=open;renderSurveys();toast(open?'تم استئناف استقبال الردود':'تم إيقاف استقبال الردود');});
}
function deleteForm(fid){
  var f=A.forms[fid],n=formResps(fid).length;
  if(!confirm('حذف استبانة «'+f.title+'»'+(n?' وجميع ردودها ('+n+')':'')+'؟ لا يمكن التراجع.'))return;
  Promise.all([rm('att_forms/'+A.code+'/'+fid),rm('att_resp/'+A.code+'/'+fid)]).then(function(){
    delete A.forms[fid];if(A.resps)delete A.resps[fid];renderSurveys();toast('تم الحذف');
  });
}

// ---------- تحليل الردود ----------
function rateOf(p){
  if(p==null) return null;
  if(p>=85) return {t:'ممتاز',c:'#0ca30c',i:'✔'};
  if(p>=70) return {t:'جيد جداً',c:'#0ca30c',i:'✔'};
  if(p>=55) return {t:'جيد',c:'#fab219',i:'●'};
  if(p>=40) return {t:'مقبول',c:'#ec835a',i:'▲'};
  return {t:'ضعيف',c:'#d03b3b',i:'✖'};
}
function analyze(f){
  var t=tplById(f.tpl),qs=tplQuestions(t),rs=formResps(f.id),idx=!t.noIndex;
  var out={t:t,qs:[],n:rs.length,blocks:{},overall:null,last:0,days:{},fields:[]};
  rs.forEach(function(r){
    if(r.at>out.last)out.last=r.at;
    var k=dateKey(new Date(r.at));out.days[k]=(out.days[k]||0)+1;
  });
  qs.forEach(function(q){
    var o={q:q,counts:[],answered:0,mean:null,texts:[],others:[]};
    if(q.type==='likert'||q.type==='single'||q.type==='multi'){
      var opts=q.type==='likert'?SURVEY_SCALES[q.scale].opts:q.opts;
      o.counts=opts.map(function(){return 0;});
      var sum=0,cnt=0,sc=q.type==='likert'?SURVEY_SCALES[q.scale].scores:null;
      rs.forEach(function(r){
        var v=r.a&&r.a[q.id];
        if(v==null||v==='') return;
        if(q.type==='multi'){toArr(v).forEach(function(i){if(o.counts[i]!=null)o.counts[i]++;});o.answered++;
          if(r.a[q.id+'_o'])o.others.push(r.a[q.id+'_o']);return;}
        v=+v;if(o.counts[v]==null)return;o.counts[v]++;o.answered++;
        if(sc&&sc[v]!=null){var s=sc[v];sum+=q.rev?100-s:s;cnt++;}
      });
      if(rs.length) o.answeredAny=true;
      if(sc&&cnt){o.mean=sum/cnt;o.valid=cnt;}
      // المقياس التشخيصي (أوافق/لا أوافق) يُعرض كنسبة الموافقة
      if(q.type==='likert'&&!idx&&o.answered) o.agree=o.counts[0]*100/o.answered;
    } else if(q.type==='text'){
      rs.forEach(function(r){var v=r.a&&r.a[q.id];if(v&&String(v).trim())o.texts.push({v:String(v).trim(),at:r.at,who:r.f&&(r.f.name||r.f.parent||r.f.student)||''});});
    }
    out.qs.push(o);
    if(q.type==='likert'&&o.mean!=null&&idx){(out.blocks[q.block]=out.blocks[q.block]||{title:q.blockTitle,m:[]}).m.push(o.mean);}
  });
  var all=[];Object.keys(out.blocks).forEach(function(b){var B=out.blocks[b];B.mean=B.m.reduce(function(a,x){return a+x;},0)/B.m.length;all=all.concat(B.m);});
  if(idx&&all.length) out.overall=all.reduce(function(a,x){return a+x;},0)/all.length;
  t.fields.forEach(function(fd){
    if(fd.type!=='select')return;
    var c=fd.opts.map(function(){return 0;});
    rs.forEach(function(r){var i=fd.opts.indexOf(r.f&&r.f[fd.id]);if(i>=0)c[i]++;});
    if(c.some(function(x){return x;})) out.fields.push({fd:fd,counts:c});
  });
  return out;
}
function pctTxt(x){return x==null?'—':(Math.round(x*10)/10).toString().replace(/\.0$/,'')+'%';}
function tip(s){return ' data-tip="'+esc(s)+'"';}
function stackHtml(o){
  var opts=SURVEY_SCALES[o.q.scale].opts,cols=LK_COLORS[opts.length],tot=o.answered;
  if(!tot) return '<div class="stack"><span style="flex:1;background:#f3f2ee;color:#898781">لا توجد إجابات</span></div>';
  return '<div class="stack">'+o.counts.map(function(c,i){
    if(!c) return '';
    var p=c*100/tot;
    return '<span style="flex:'+c+';background:'+cols[i]+';color:'+LK_INK[cols[i]]+'"'+tip(opts[i]+': '+c+' ('+pctTxt(p)+')')+'>'+(p>=12?Math.round(p)+'%':'')+'</span>';
  }).join('')+'</div>';
}
function barsHtml(labels,counts,base){
  var max=Math.max.apply(null,counts.concat([1]));
  return labels.map(function(l,i){
    var c=counts[i],p=base?c*100/base:0;
    return '<div class="hb"'+tip(l+': '+c+(base?' ('+pctTxt(p)+')':''))+'><div class="t">'+esc(l)+'</div><div class="track"><i style="width:'+(c*100/max)+'%"></i></div><div class="v">'+c+(base?' • '+Math.round(p)+'%':'')+'</div></div>';
  }).join('');
}
function legendHtml(scale){
  var opts=SURVEY_SCALES[scale].opts,cols=LK_COLORS[opts.length];
  return '<div class="legend">'+opts.map(function(o,i){return '<span><i style="background:'+cols[i]+'"></i>'+esc(o)+'</span>';}).join('')+'</div>';
}

// ---------- لوحة النتائج ----------
function openDash(fid){A.svDash=fid;renderSurveys();window.scrollTo(0,0);}
function renderDash(fid){
  var f=Object.assign({id:fid},A.forms[fid]),R=analyze(f),t=R.t,idx=!t.noIndex,rt=rateOf(R.overall);
  var html='<div class="toolbar"><button class="btn btn-o btn-sm" onclick="A.svDash=null;renderSurveys()">→ رجوع</button>'+
    '<div class="grow"><div style="font-weight:800;color:var(--gd);font-size:16px">'+esc(f.title)+'</div><div class="muted"><span class="aud">'+esc(f.aud)+'</span> • أُطلقت '+esc(dateKey(new Date(f.createdAt)))+(f.open===false?' • ⏸ متوقفة':'')+'</div></div>'+
    '<button class="btn btn-g btn-sm" onclick="formLinkModal(\''+fid+'\')">🔗 الرابط</button>'+
    (R.n?'<button class="btn btn-sm" onclick="exportFormPdf(\''+fid+'\')">📄 تقرير PDF</button><button class="btn btn-o btn-sm" onclick="exportFormCsv(\''+fid+'\')">⬇ Excel</button>':'')+'</div>';
  html+='<div class="kpis"><div class="card kpi"><div class="l">عدد الردود</div><div class="v">'+R.n+'</div></div>'+
    (idx?'<div class="card kpi"><div class="l">مؤشر الرضا العام</div><div class="v">'+pctTxt(R.overall)+'</div>'+(rt?'<span class="rate"><i style="background:'+rt.c+'"></i>'+rt.i+' '+rt.t+'</span>':'')+'</div>':
      '<div class="card kpi"><div class="l">عدد الأسئلة</div><div class="v">'+R.qs.length+'</div></div>')+
    '<div class="card kpi"><div class="l">آخر رد</div><div class="v" style="font-size:17px;padding-top:8px">'+(R.last?dateKey(new Date(R.last))+'<br><small>'+hm(R.last)+'</small>':'—')+'</div></div></div>';
  if(!R.n){
    $('secSurv').innerHTML=html+'<div class="card empty"><span class="e">📭</span>لم تصل أي ردود بعد.<br>أرسل رابط الاستبانة لـ'+esc(f.aud)+' وستظهر النتائج هنا فور وصولها.</div>';
    return;
  }
  // الردود حسب اليوم
  var dk=Object.keys(R.days).sort(),maxD=Math.max.apply(null,dk.map(function(k){return R.days[k];}));
  html+='<div class="card dsec"><h3>الردود حسب اليوم</h3><div class="sub">'+dk.length+' يوماً استقبلت ردوداً</div>'+
    '<div class="cols">'+dk.map(function(k){return '<span style="height:'+(R.days[k]*100/maxD)+'%"'+tip(k+': '+R.days[k]+' رداً')+'></span>';}).join('')+'</div>'+
    '<div class="cols-x">'+dk.map(function(k){var d=parseKey(k);return '<span>'+d.getDate()+'/'+(d.getMonth()+1)+'</span>';}).join('')+'</div></div>';
  // المجالات
  var bk=Object.keys(R.blocks);
  if(idx&&bk.length>1){
    html+='<div class="card dsec"><h3>مؤشر الرضا حسب المجال</h3><div class="sub">متوسط درجات عبارات كل مجال من 100%</div>'+
      bk.map(function(b){var B=R.blocks[b],r=rateOf(B.mean);
        return '<div class="hb"'+tip(B.title+': '+pctTxt(B.mean))+'><div class="t">'+esc(B.title)+'</div><div class="track"><i style="width:'+B.mean+'%"></i></div><div class="v">'+pctTxt(B.mean)+'</div></div>';}).join('')+'</div>';
  }
  // أبرز نقاط القوة والتحسين
  var lk=R.qs.filter(function(o){return o.q.type==='likert'&&o.mean!=null;});
  if(idx&&lk.length>=4){
    var srt=lk.slice().sort(function(a,b){return b.mean-a.mean;});
    var li=function(arr){return arr.map(function(o){return '<div class="it"><b>'+pctTxt(o.mean)+'</b><span>'+esc(o.q.t)+'</span></div>';}).join('');};
    html+='<div class="sw"><div class="card dsec"><h3>✔ أبرز نقاط القوة</h3><div class="sub">العبارات الأعلى رضا</div>'+li(srt.slice(0,3))+'</div>'+
      '<div class="card dsec"><h3>▲ أولويات التحسين</h3><div class="sub">العبارات الأقل رضا</div>'+li(srt.slice(-3).reverse())+'</div></div>';
  }
  // توزيع إجابات كل عبارة
  var lastBlock=-1;
  R.qs.forEach(function(o,i){
    var q=o.q;
    if(q.type==='likert'){
      if(q.block!==lastBlock){
        if(lastBlock!==-1) html+='</div>';
        lastBlock=q.block;
        html+='<div class="card dsec"><h3>'+esc(q.blockTitle||'توزيع الإجابات')+'</h3><div class="sub">'+
          (idx?'العمود الأخير: درجة الرضا عن العبارة من 100%':'العمود الأخير: نسبة من اختار «'+esc(SURVEY_SCALES[q.scale].opts[0])+'»')+'</div>'+legendHtml(q.scale);
      }
      var m=idx?o.mean:o.agree;
      html+='<div class="lk-row"><div class="t">'+(i+1)+'. '+esc(q.t)+(q.rev?' <span class="muted">(عبارة سلبية)</span>':'')+'</div>'+stackHtml(o)+'<div class="m">'+pctTxt(m)+'</div></div>';
      return;
    }
    if(lastBlock!==-1){html+='</div>';lastBlock=-1;}
    if(q.type==='single'||q.type==='multi'){
      html+='<div class="card dsec"><h3>'+esc(q.t)+'</h3><div class="sub">'+(q.type==='multi'?'اختيار متعدد • النسبة من '+o.answered+' مستجيباً':'أجاب '+o.answered+' مستجيباً')+'</div>'+
        barsHtml(q.opts,o.counts,o.answered)+
        (o.others.length?'<div class="sub" style="margin-top:10px">إجابات أخرى ('+o.others.length+'):</div>'+o.others.map(function(x){return '<div class="quote">'+esc(x)+'</div>';}).join(''):'')+'</div>';
    } else if(q.type==='text'){
      html+='<div class="card dsec"><h3>'+esc(q.t)+'</h3><div class="sub">'+o.texts.length+' إجابة مكتوبة</div>'+
        (o.texts.length?o.texts.slice().reverse().map(function(x){return '<div class="quote">'+esc(x.v)+'<small>'+(x.who?esc(x.who)+' • ':'')+dateKey(new Date(x.at))+'</small></div>';}).join(''):'<div class="muted">لا توجد إجابات</div>')+'</div>';
    }
  });
  if(lastBlock!==-1) html+='</div>';
  // توزيع المستجيبين (مثل الصف)
  R.fields.forEach(function(F){
    var tot=F.counts.reduce(function(a,x){return a+x;},0);
    html+='<div class="card dsec"><h3>المستجيبون حسب '+esc(F.fd.label)+'</h3><div class="sub">'+tot+' مستجيباً حدّدوا '+esc(F.fd.label)+'</div>'+barsHtml(F.fd.opts,F.counts,tot)+'</div>';
  });
  $('secSurv').innerHTML=html;
}

// تلميح عند المرور على الأشرطة
document.addEventListener('mouseover',function(e){
  var el=e.target.closest&&e.target.closest('[data-tip]'),t=$('vizTip');
  if(!t){t=document.createElement('div');t.id='vizTip';document.body.appendChild(t);}
  if(!el){t.style.display='none';return;}
  t.textContent=el.getAttribute('data-tip');t.style.display='block';
});
document.addEventListener('mousemove',function(e){
  var t=$('vizTip');if(!t||t.style.display!=='block')return;
  t.style.left=Math.min(e.clientX+12,window.innerWidth-t.offsetWidth-8)+'px';t.style.top=(e.clientY+14)+'px';
});

  var f=Object.assign({id:fid},A.forms[fid]),R=analyze(f),t=R.t,idx=!t.noIndex,rt=rateOf(R.overall);
  var css='.kp{display:flex;gap:8px;margin:6px 0 12px}.kp div{flex:1;border:1px solid #c9d2e3;border-radius:8px;padding:8px;text-align:center}.kp b{display:block;font-size:20px;color:#0b0b0b}'+
    '.st{display:flex;gap:1px;height:14px;width:100%}.st span{display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact}'+
    '.bar{height:10px;background:#2a78d6;border-radius:0 3px 3px 0;-webkit-print-color-adjust:exact;print-color-adjust:exact}td.l{text-align:right}'+
    '.lg{display:flex;flex-wrap:wrap;gap:10px;font-size:10.5px;margin:4px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}'+
    '.q{background:#f7f9fc;border-radius:6px;padding:5px 8px;margin:4px 0;line-height:1.7;-webkit-print-color-adjust:exact;print-color-adjust:exact}';
